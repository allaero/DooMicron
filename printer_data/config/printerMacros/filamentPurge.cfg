# ======================================================================================================== #
# =========================================== NOZZLE CLEANING ============================================ #
# ======================================================================================================== #

[gcode_macro _CLEAN_NOZZLE]
description: Clean nozzle on silicone brush with snaking pattern and progressive Z raise
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set TYPE = params.TYPE|default("standard")|string|lower %}
    {% set NOZZLE_TARGET = params.TARGET|default(0)|float %}
    {% set CURRENT_TARGET = printer.extruder.target|float %}
    {% set MIN_TEMP = macrocfg.min_extrude_temp|float %}
    {% set CLEAN_HOT = macrocfg.clean_hot %}
    {% set CLEAN_X = macrocfg.clean_x %}
    {% set CLEAN_Y = macrocfg.clean_y %}
    {% set CLEAN_Z = macrocfg.clean_z %}
    {% set POST_Z = macrocfg.clean_raise_distance %}
    {% set WIPE_DISTANCE = macrocfg.clean_wipe_distance %}
    {% set WIPE_QUANTITY = macrocfg.clean_wipe_quantity %}
    {% set BRUSH_DEPTH = macrocfg.clean_brush_depth %}
    {% set TRAVEL_SPEED = macrocfg.travel_fast %}
    {% set Z_SPEED = macrocfg.z_speed %}
    {% set NOZZLE_CLEAN_TEMP = macrocfg.extruder_preheat_temp %}
    {% set TEMP_TOLERANCE = macrocfg.temp_tolerance %}
    {% set POST_CLEAN_HOME = macrocfg.post_clean_home %}
    {% set Y_RANDOMIZE = macrocfg.clean_y_randomize %}
    {% set Y_VARIANCE = macrocfg.clean_y_variance %}
        
    # Allow override via HEAT parameter
    {% if params.HEAT is defined %}
        {% set CLEAN_HOT = True if params.HEAT|lower == 'true' else False %}
    {% endif %}

    # Determine target cleaning temperature
    {% if NOZZLE_TARGET > 0 %}
        {% set TARGET_TEMP = NOZZLE_TARGET %}
    {% elif CURRENT_TARGET > 0 %}
        {% set TARGET_TEMP = CURRENT_TARGET %}
    {% else %}
        {% set TARGET_TEMP = NOZZLE_CLEAN_TEMP %}
    {% endif %}
    
    # Check current temperature
    {% set CURRENT_TEMP = printer.extruder.temperature %}
    
    # Check if current temp is already hot enough for cleaning (within tolerance of TARGET)
    {% set HOT_ENOUGH = CURRENT_TEMP >= (TARGET_TEMP - TEMP_TOLERANCE) %}
    
    # Determine if we need to heat
    {% set SHOULD_HEAT = CLEAN_HOT and not HOT_ENOUGH %}

    _CG28                                                       # Home if needed

    # Heat nozzle if needed
    {% if SHOULD_HEAT %}
        _SET_LED_STATUS STATUS=HEATING
        RESPOND MSG="🔥 Heating extruder to {TARGET_TEMP}°C for cleaning (current: {CURRENT_TEMP|round(1)}°C)"
        M104 S{TARGET_TEMP}                                     # Set target without waiting
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TARGET_TEMP - TEMP_TOLERANCE}  # Wait until hot enough (with tolerance)
    {% elif CLEAN_HOT %}
        RESPOND MSG="Nozzle already hot enough for cleaning ({CURRENT_TEMP|round(1)}°C, min: {TARGET_TEMP - TEMP_TOLERANCE}°C)"
    {% else %}
        RESPOND MSG="Cold cleaning mode - skipping heating"
    {% endif %}
    
    G90                                                         # Absolute positioning
    
    # Calculate brush boundaries
    {% set BRUSH_BACK = CLEAN_Y + (BRUSH_DEPTH / 2) %}         # Back of brush (max Y)
    {% set BRUSH_FRONT = CLEAN_Y - (BRUSH_DEPTH / 2) %}        # Front of brush (min Y)
    {% set BRUSH_RIGHT = CLEAN_X %}                             # Right side of brush
    {% set BRUSH_LEFT = CLEAN_X - WIPE_DISTANCE %}              # Left side of brush
    
    # Calculate randomized starting Y position (back area only)
    {% if Y_RANDOMIZE == True %}
        {% set RANDOM_RANGE = range(0, (Y_VARIANCE * 100) | int) %}
        {% set Y_OFFSET = (RANDOM_RANGE | random / 100.0) %}
        {% set START_Y = BRUSH_BACK - Y_OFFSET %}               # Start somewhere in back, within variance
        RESPOND MSG="Randomized start position: {Y_OFFSET | round(2)}mm from back edge"
    {% else %}
        {% set START_Y = BRUSH_BACK %}                          # Start at very back
    {% endif %}
    
    # Calculate Y step per wipe (evenly distribute wipes across brush depth)
    {% set TOTAL_Y_DISTANCE = START_Y - BRUSH_FRONT %}
    {% set Y_STEP = TOTAL_Y_DISTANCE / WIPE_QUANTITY %}
    
    # Z progression settings
    {% set START_Z = 1.0 %}                                     # Starting Z height (deeper)
    {% set END_Z = CLEAN_Z %}                                   # Ending Z height (shallower, usually 0.5)
    {% set Z_STEP = (END_Z - START_Z) / WIPE_QUANTITY %}        # Z change per wipe
    
    {% if TYPE == "blobifier" %}
        # Blobifier pattern: Start at back left, snake to front right
        G0 X{BRUSH_LEFT} Y{BRUSH_BACK} Z{START_Z} F{TRAVEL_SPEED}
        M400
        
        # Execute snaking cleaning pattern (back to front)
        {% for wipe in range(WIPE_QUANTITY) %}
            {% set CURRENT_Y = BRUSH_BACK - (Y_STEP * wipe) %}
            {% set CURRENT_Z = START_Z + (Z_STEP * wipe) %}
            
            # Alternate sweep direction (snake pattern)
            {% if loop.index % 2 == 1 %}
                # Odd wipes: sweep RIGHT (left to right)
                G0 X{BRUSH_RIGHT} Y{CURRENT_Y} Z{CURRENT_Z} F{TRAVEL_SPEED}
            {% else %}
                # Even wipes: sweep LEFT (right to left)
                G0 X{BRUSH_LEFT} Y{CURRENT_Y} Z{CURRENT_Z} F{TRAVEL_SPEED}
            {% endif %}
        {% endfor %}
        
    {% else %}
        # Standard pattern: Start at back right, move to front left
        G0 X{BRUSH_RIGHT} Y{START_Y} Z{START_Z} F{TRAVEL_SPEED}
        M400
        
        # Execute snaking cleaning pattern
        {% for wipe in range(WIPE_QUANTITY) %}
            {% set CURRENT_Y = START_Y - (Y_STEP * wipe) %}
            {% set CURRENT_Z = START_Z + (Z_STEP * wipe) %}
            
            # Alternate sweep direction (snake pattern)
            {% if loop.index % 2 == 1 %}
                # Odd wipes: sweep LEFT (right to left)
                G0 X{BRUSH_LEFT} Y{CURRENT_Y} Z{CURRENT_Z} F{TRAVEL_SPEED}
            {% else %}
                # Even wipes: sweep RIGHT (left to right)
                G0 X{BRUSH_RIGHT} Y{CURRENT_Y} Z{CURRENT_Z} F{TRAVEL_SPEED}
            {% endif %}
        {% endfor %}
    {% endif %}
    
    # Raise after wiping
    G0 Z{POST_Z} F{Z_SPEED}
    RESPOND MSG="Snake pattern complete: {WIPE_QUANTITY} passes"
    
    # Cool down only if we heated it ourselves
    {% if SHOULD_HEAT %}
        RESPOND MSG="❄️ Cooling extruder"
        M104 S0                                                 # Turn off heater
    {% endif %}
    
    {% if POST_CLEAN_HOME == True %}
        G28 Z                                                   # Re-home Z if configured
    {% endif %}
    
    _SET_LED_STATUS STATUS=STANDBY
    M400
    RESPOND MSG="✅ Nozzle cleaning complete"


# ======================================================================================================== #
# =========================================== PURGE OPERATIONS =========================================== #
# ======================================================================================================== #

[gcode_macro _PURGE]
description: Unified purge macro with DYNAMIC state tracking
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set TYPE = params.TYPE|default('auto')|lower %}
    {% set TEMP = params.TEMP|default(macrocfg.extruder_temp)|float %}
    {% set STARTING_PRINT = macrocfg.starting_print %}
    {% set FILAMENT_DIAMETER = macrocfg.filament_diameter %}
    {% set PURGE_VOLUME_BUFFER = macrocfg.purge_volume_buffer %}
    {% set DIST_BLADE_TO_HEATSINK = macrocfg.dist_blade_to_heatsink %}
    {% set DIST_HEATSINK_TO_MZE = macrocfg.dist_heatsink_to_mze %}
    {% set DIST_MZE_TO_NOZZLE = macrocfg.dist_mze_to_nozzle %}
    {% set TOTAL_LOWER_TO_NOZZLE = macrocfg.total_lower_to_nozzle %}
    
    # Get dynamic filament state
    {% set LAST_OPERATION = macrocfg.last_filament_operation %}
    {% set LAST_RETRACT = macrocfg.last_retract_amount %}
    {% set LAST_PUSH = macrocfg.last_push_amount %}
    
    # Auto-detect purge type if not specified
    {% if TYPE == 'auto' %}
        {% if STARTING_PRINT == 1 %}
            {% set TYPE = 'standard' %}
        {% else %}
            {% set TYPE = 'blobifier' %}
        {% endif %}
    {% endif %}
    
    RESPOND MSG="Executing {TYPE} purge"
    
    # Calculate purge parameters
    {% set FILAMENT_RADIUS = FILAMENT_DIAMETER / 2 %}
    {% set FILAMENT_CROSS_SECTION = 3.14159 * (FILAMENT_RADIUS * FILAMENT_RADIUS) %}
    {% set HOTEND_VOLUME_MM = DIST_BLADE_TO_HEATSINK + DIST_HEATSINK_TO_MZE + DIST_MZE_TO_NOZZLE %}
    {% set HOTEND_VOLUME_MM3 = HOTEND_VOLUME_MM * FILAMENT_CROSS_SECTION %}
    {% set CALCULATED_PURGE_LENGTH = (HOTEND_VOLUME_MM3 * PURGE_VOLUME_BUFFER) / FILAMENT_CROSS_SECTION %}
    {% set PURGE_PRIME = 5.0 %}  # Default fallback
    
    {% if LAST_OPERATION == 'full_unload' %}
        # Full unload - prime from lower sensor to nozzle
        {% set PURGE_PRIME = TOTAL_LOWER_TO_NOZZLE %}
        RESPOND MSG="Full unload detected - priming from lower sensor ({PURGE_PRIME | round(1)}mm)"
        
    {% elif LAST_OPERATION == 'cut_retract' %}
        # Cut + retract - calculate net retraction
        {% set NET_RETRACT = LAST_RETRACT - LAST_PUSH %}
        {% set PURGE_PRIME = NET_RETRACT %}
        RESPOND MSG="Cut+retract: {LAST_RETRACT|round(1)}mm retract, {LAST_PUSH|round(1)}mm push = {NET_RETRACT|round(1)}mm net"
        
    {% elif LAST_OPERATION == 'retract_only' %}
        # Retract only (no cut) - prime full retraction
        {% set PURGE_PRIME = LAST_RETRACT %}
        RESPOND MSG="Retract only - priming {PURGE_PRIME | round(1)}mm"

    {% endif %}
    
    RESPOND MSG="Total purge: {CALCULATED_PURGE_LENGTH | round(1)}mm, Prime: {PURGE_PRIME | round(1)}mm"
    
    # Store calculated values
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=calculated_purge_length VALUE={CALCULATED_PURGE_LENGTH}
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=calculated_purge_prime VALUE={PURGE_PRIME}
    
    # Route to appropriate purge method
    {% if TYPE == 'standard' %}
        _PURGE_STANDARD TEMP={TEMP}
    {% elif TYPE == 'blobifier' %}
        _PURGE_BLOBIFIER TEMP={TEMP}
    {% else %}
        RESPOND MSG="Error: Unknown purge type '{TYPE}'"
    {% endif %}
    
    # Clear the operation state after successful purge
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE="'none'"
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE=0.0


# ======================================================================================================== #
# ======================================= STANDARD PURGE (PRINT START) =================================== #
# ======================================================================================================== #

[gcode_macro _PURGE_STANDARD]
description: Standard purge for print start using blobifier-style sequence
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONFIG = printer.configfile.settings %}
    {% set TARGET = params.TEMP|default(macrocfg.extruder_temp)|float %}
    {% set CUR_TEMP = printer.extruder.temperature|float %}
    {% set MIN_TEMP = macrocfg.min_extrude_temp %}
    {% set TEMP_TOLERANCE = macrocfg.temp_tolerance %}
    {% set Z_SPEED = macrocfg.z_speed %}
    {% set PURGE_Z_HEIGHT = macrocfg.purge_z_height %}
    {% set PURGE_Z_OFFSET = macrocfg.purge_z_offset %}
    {% set PURGE_COOLING_FAN_SPEED = macrocfg.purge_cooling_fan_speed %}
    {% set PURGE_PAUSE_TIME = macrocfg.purge_pause_time %}
    {% set CLEANING = macrocfg.cleaning %}
    {% set CLEANUP_X = macrocfg.cleanup_x %}
    {% set CLEANUP_Y = macrocfg.cleanup_y %}
    {% set PURGE_Y = macrocfg.purge_y %}
    {% set TRAVEL_SLOW = macrocfg.travel_slow %}
    {% set PURGE_LIFT = macrocfg.purge_final_lift %}
    
    _SET_LED_STATUS STATUS=PRINTING
    
    # Move to purge position using new parking system
    EXECUTE_PARKING TYPE=PURGE_STANDARD
    
    # Setup for purge
    G92 E0
    
    # Execute shared purge sequence
    _EXECUTE_PURGE_SEQUENCE TYPE=STANDARD
    
    # Post-purge cleanup and cooling
    G91
    G1 Z{PURGE_Z_HEIGHT} F{Z_SPEED}
    G90
    
    # Cooling phase
    M106 S{PURGE_COOLING_FAN_SPEED}
    G4 P{PURGE_PAUSE_TIME}
    M106 S0

    {% if CLEANING == True %}
        _CLEAN_NOZZLE
    {% else %}
        # Waste management setup
        RESPOND MSG="Managing purge waste"
        G1 X{CLEANUP_X} Y{CLEANUP_Y} F{TRAVEL_SLOW}
        
        # Second cooling phase
        M106 S{PURGE_COOLING_FAN_SPEED}
        G4 P{PURGE_PAUSE_TIME}
        M106 S0

        # Waste management - push purge into waste area
        G1 Z{PURGE_Z_OFFSET} F{Z_SPEED}
        G1 Y{PURGE_Y} F{TRAVEL_SLOW}
        G91
        G1 Z{PURGE_LIFT} F{Z_SPEED}
        G90
    {% endif %}
    
    _SET_LED_STATUS STATUS=STANDBY
    RESPOND MSG="✅ Standard purge complete"


# ======================================================================================================== #
# ====================================== COLORCHANGE PURGE (BLOBIFIER) =================================== #
# ======================================================================================================== #

[gcode_macro _PURGE_BLOBIFIER]
description: Color change purge using blobifier system
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set BLOBIFIER_ENABLED = macrocfg.blobifier_enabled %}
    {% set TARGET = params.TEMP|default(macrocfg.blobifier_purge_temp)|float %}
    {% set CUR_TEMP = printer.extruder.temperature|float %}
    {% set TEMP_TOLERANCE = macrocfg.temp_tolerance %}
    {% set TRAVEL_SPEED = macrocfg.travel_fast %}
    {% set SAFE_X = macrocfg.blobifier_safe_x %}
    {% set SAFE_Y = macrocfg.blobifier_safe_y %}
    {% set SAFE_Z = macrocfg.blobifier_safe_z %}
    
    # Check if blobifier is enabled
    {% if BLOBIFIER_ENABLED == False %}
        RESPOND MSG="Error: Blobifier disabled, falling back to standard purge"
        _PURGE_STANDARD TEMP={TARGET}
    {% else %}
        # Only save state if we're homed (mid-print scenario)
        {% if "xyz" in printer.toolhead.homed_axes %}
            # Save Z position for return (X/Y will be handled by parking)
            {% set return_z = printer.toolhead.position.z %}
            SAVE_GCODE_STATE NAME=BLOBIFIER_PURGE_STATE
        {% else %}
            RESPOND MSG="Warning: Not homed, skipping state save"
            {% set return_z = SAFE_Z %}
        {% endif %}
        
        _SET_LED_STATUS STATUS=PRINTING
        
        # Move to blobifier position using new parking system
        EXECUTE_PARKING TYPE=PURGE_BLOBIFIER
        
        # Extend blobifier tray
        _BLOBIFIER_SERVO POS=out
        
        # Execute shared purge sequence
        _EXECUTE_PURGE_SEQUENCE TYPE=BLOBIFIER
        
        # Final cleanup
        G4 P1000
        _BLOBIFIER_SERVO POS=in
        
        # Clean nozzle after blobifier purge (still at purge area)
        _CLEAN_NOZZLE TYPE=blobifier HEAT=false
        
        # Return strategy depends on whether we were homed
        {% if "xyz" in printer.toolhead.homed_axes %}
            # Restore Z, then move XY to safe position
            G90
            G1 Z{return_z} F{TRAVEL_SPEED}
            RESTORE_GCODE_STATE NAME=BLOBIFIER_PURGE_STATE MOVE=1 MOVE_SPEED=100
        {% else %}
            # Just go to safe position if we weren't homed
            G90
            G1 X{SAFE_X} Y{SAFE_Y} Z{SAFE_Z} F{TRAVEL_SPEED}
        {% endif %}
        
        _SET_LED_STATUS STATUS=STANDBY
        RESPOND MSG="✅ Blobifier purge complete"
    {% endif %}
    

[gcode_macro _BLOBIFIER_SERVO]
description: Simplified blobifier servo control
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set POS = params.POS|default('out')|lower %}
    {% set DWELL_TIME = macrocfg.blobifier_servo_dwell_time %}
    
    {% if POS == 'in' or POS == '0' %}
        SET_SERVO SERVO=blobifier_servo ANGLE=180
        G4 P{DWELL_TIME}
    {% elif POS == 'out' or POS == '1' %}
        SET_SERVO SERVO=blobifier_servo ANGLE=0
        G4 P{DWELL_TIME}
    {% else %}
        RESPOND MSG="Error: Invalid servo position. Use 'in' or 'out'"
    {% endif %}
    SET_SERVO SERVO=blobifier_servo WIDTH=0


# ======================================================================================================== #
# ======================================= PURGE EXECUTION MACRO ========================================== #
# ======================================================================================================== #

[gcode_macro _EXECUTE_PURGE_SEQUENCE]
description: Execute blobifier-style iterative purge sequence (best purge shape)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set PURGE_LENGTH = macrocfg.calculated_purge_length %}
    {% set PURGE_PRIME = macrocfg.calculated_purge_prime %}
    {% set TYPE = params.TYPE|default('standard')|lower %}
    {% set MAX_ITERATION_LENGTH = macrocfg.purge_max_iteration_length %}
    {% set RAISE_Z = macrocfg.purge_iteration_z_raise %}
    {% set ITERATION_Z_CHANGE = macrocfg.purge_iteration_z_change %}
    {% set MAX_ITERATIONS_PER_BLOB = macrocfg.purge_max_iterations_per_blob %}
    {% set EXTRUDE_SPEED = macrocfg.purge_speed %}
    {% set PREFILL_SPEED = macrocfg.filament_extrude_fast %}
    {% set Z_SPEED = macrocfg.z_speed %}
    {% set RETRACT_DIST = macrocfg.purge_retract %}
    {% set RETRACT_FAST = macrocfg.filament_retract_fast %}
    {% set BLOBIFIER_PURGE_Z = macrocfg.blobifier_purge_z %}
    {% set BLOBIFIER_EJECT_HOP = macrocfg.blobifier_eject_hop %}
    {% set SAFE_Z = macrocfg.blobifier_safe_z %}
    {% set LIFT_X = macrocfg.blobifier_lift_x %}
    {% set PURGE_X = macrocfg.blobifier_purge_x %}
    
    # Verify temperature before purging
    _VERIFY_EXTRUDE_TEMP
    _SET_LED_STATUS STATUS=PRINTING
    
    # Prime the nozzle
    G91
    M83
    G1 E{PURGE_PRIME} F{PREFILL_SPEED}
    G90
    M400
    
    # Calculate iterations needed
    {% set TOTAL_ITERATIONS = 2 %}  # Max 2 iterations for standard
    {% set EFFECTIVE_LENGTH = PURGE_LENGTH / TOTAL_ITERATIONS %}

    RESPOND MSG="Executing {TOTAL_ITERATIONS} purge iterations for {PURGE_LENGTH | round(1)}mm"
    
    # Execute iterative purge sequence
    {% for iteration in range(TOTAL_ITERATIONS) %}
        {% set CURRENT_BLOB_STEP = iteration % MAX_ITERATIONS_PER_BLOB %}
        
        # Calculate extrusion amount for this iteration
        {% set REMAINING_LENGTH = PURGE_LENGTH - (MAX_ITERATION_LENGTH * iteration) %}
        {% set EXTRUDE_AMOUNT = [REMAINING_LENGTH, EFFECTIVE_LENGTH] | min %}
        
        # Execute purge iteration
        G91
        M83
        G1 Z{RAISE_Z} E{EXTRUDE_AMOUNT} F{EXTRUDE_SPEED}
        G90
        
        # Handle blob completion or end of purge
        {% set MAX_ITERATIONS_REACHED = CURRENT_BLOB_STEP == MAX_ITERATIONS_PER_BLOB - 1 %}
        {% set PURGE_COMPLETE = REMAINING_LENGTH <= MAX_ITERATION_LENGTH %}
        {% set IS_LAST_ITERATION = iteration == TOTAL_ITERATIONS - 1 %}
        
        {% if MAX_ITERATIONS_REACHED or PURGE_COMPLETE or IS_LAST_ITERATION %}
            # Handle blob completion based on type
            {% if TYPE == 'blobifier' %}
                G91
                G1 X{LIFT_X} Z{BLOBIFIER_EJECT_HOP} F{Z_SPEED}
                G90
                M400
                
                _BLOBIFIER_SERVO POS=in
                G1 X{PURGE_X} Z{BLOBIFIER_PURGE_Z}
                _BLOBIFIER_SERVO POS=out
                _BLOBIFIER_SERVO POS=in
                _BLOBIFIER_SERVO POS=out
                
                G91
                G1 Z{SAFE_Z} F{Z_SPEED}
                G90
            {% endif %}
            G91
            G1 E-{RETRACT_DIST} F{RETRACT_FAST}
            G90
        {% endif %}
    {% endfor %}
    
    {% set TOTAL_PURGED = PURGE_LENGTH + PURGE_PRIME %}
    RESPOND MSG="✅ Purge sequence complete (Total: {TOTAL_PURGED | round(1)}mm)"
    

# ======================================================================================================== #
# ============================================= ADAPTIVE PURGE =========================================== #
# ======================================================================================================== #

[gcode_macro _ADAPTIVE_PURGE]
description: Adaptive purge macro - currently unused
gcode:
    # Parameter collection from macro variables
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_fast %}
    {% set PREFULL_AMOUNT = macrocfg.purge_retract * macrocfg.prefill_factor %}
    {% set PURGE_ADAPTIVE = macrocfg.purge_adaptive %}
    {% set MIN_TEMP = macrocfg.min_extrude_temp %}
    {% set PURGE_X = macrocfg.purge_x | float %}
    {% set PURGE_Y = macrocfg.purge_y | float %}
    {% set PURGE_SIZE = macrocfg.adaptive_purge_size | float %}
    {% set PURGE_Z_HEIGHT = macrocfg.adaptive_purge_z_height | float %}
    {% set PURGE_Z_POST = macrocfg.adaptive_purge_z_post | float %}
    {% set PURGE_DISTANCE_X = macrocfg.adaptive_purge_distance_x | float %}
    {% set PURGE_DISTANCE_Y = macrocfg.adaptive_purge_distance_y | float %}
    {% set PURGE_AMOUNT = macrocfg.adaptive_purge_amount | float %}
    {% set PURGE_FLOW_RATE = macrocfg.adaptive_purge_flow_rate | float %}
    {% set RETRACT_DIST = macrocfg.adaptive_purge_retract | float %}
    {% set RETRACT_SPEED = macrocfg.filament_retract_fast | float %}
    {% set TRAVEL_SPEED = macrocfg.travel_slow | float %}
    
    # Calculate purge origin coordinates
    {% if PURGE_ADAPTIVE == True %}
        {% set ALL_POINTS = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        
        # Check if there are any objects
        {% if ALL_POINTS | length > 0 %}
            # Objects present - purge near objects
            {% set X_ORIGIN = (ALL_POINTS | map(attribute=0) | min) - PURGE_DISTANCE_X - PURGE_SIZE %}
            {% set Y_ORIGIN = (ALL_POINTS | map(attribute=1) | min) - PURGE_DISTANCE_Y - PURGE_SIZE %}
            {% set X_ORIGIN = ([X_ORIGIN, 0] | max) %}
            {% set Y_ORIGIN = ([Y_ORIGIN, 0] | max) %}
        {% else %}
            # No objects - purge in center of bed
            {% set BED_X = printer.toolhead.axis_maximum.x | float %}
            {% set BED_Y = printer.toolhead.axis_maximum.y | float %}
            {% set X_ORIGIN = (BED_X / 2) - (PURGE_SIZE / 2) %}
            {% set Y_ORIGIN = (BED_Y / 2) - (PURGE_SIZE / 2) %}
        {% endif %}

        # Calculate speed variables
        {% set PURGE_MOVE_SPEED = (2.31 * PURGE_SIZE * PURGE_FLOW_RATE / (PURGE_AMOUNT * 2.405)) * 60 %}
        
        # Calculate purge pattern coordinates
        {% set Y_START = Y_ORIGIN + PURGE_SIZE / 2 %}
        {% set X1 = X_ORIGIN + PURGE_SIZE * 0.289 %}
        {% set Y1 = Y_ORIGIN + PURGE_SIZE %}
        {% set X2 = X_ORIGIN + PURGE_SIZE * 0.789 %}
        {% set X3 = X_ORIGIN + PURGE_SIZE * 0.211 %}
        {% set X4 = X_ORIGIN + PURGE_SIZE * 0.711 %}
        {% set X_END = X_ORIGIN + PURGE_SIZE %}
        {% set Y_END = Y_ORIGIN + PURGE_SIZE / 2 %}
        {% set Z_LIFT = PURGE_Z_HEIGHT * 2 %}
        {% set PURGE_QUARTER = PURGE_AMOUNT / 4 %}
        {% set PURGE_HALF = PURGE_AMOUNT / 2 %}
    
        # Verify temperature before purging
        _CQGL
        _VERIFY_EXTRUDE_TEMP
        
        # Initialize purge sequence
        _SET_LED_STATUS STATUS=PRINTING
        G92 E0                                                  # Reset extruder position
        G0 F{TRAVEL_SPEED}                                      # Set travel speed
        G90                                                     # Absolute positioning
        
        # Move to purge starting position
        G0 X{X_ORIGIN} Y{Y_START}
        G0 Z{PURGE_Z_HEIGHT}
        
        # Execute purge pattern
        M83                                                     # Relative extrusion
        G1 E{PREFULL_AMOUNT} F{EXTRUDE_SPEED}                   # Prime nozzle
        
        # First purge line (diagonal upper)
        G1 X{X1} Y{Y1} E{PURGE_QUARTER} F{PURGE_MOVE_SPEED}
        G1 E-{RETRACT_DIST} F{RETRACT_SPEED}
        G0 Z{Z_LIFT}
        
        # Reposition for second line
        G0 X{X2} Y{Y1}
        G0 Z{PURGE_Z_HEIGHT}
        
        # Second purge line (diagonal lower)
        G1 E{RETRACT_DIST} F{EXTRUDE_SPEED}
        G1 X{X3} Y{Y_ORIGIN} E{PURGE_HALF} F{PURGE_MOVE_SPEED}
        G1 E-{RETRACT_DIST} F{RETRACT_SPEED}
        G0 Z{Z_LIFT}
        
        # Reposition for third line
        G0 X{X4} Y{Y_ORIGIN}
        G0 Z{PURGE_Z_HEIGHT}
        
        # Third purge line (vertical right)
        G1 E{RETRACT_DIST} F{EXTRUDE_SPEED}
        G1 X{X_END} Y{Y_END} E{PURGE_QUARTER} F{PURGE_MOVE_SPEED}
        G1 E-{RETRACT_DIST} F{RETRACT_SPEED}
        
        # Complete purge sequence
        G92 E0                                                  # Reset extruder position
        G0 Z{PURGE_Z_POST}                                            # Lift to safe height
        
        _SET_LED_STATUS STATUS=STANDBY
    {% endif %}
    
    