# ======================================================================================================== #
# ======================================== CONFIGURATION BACKUP ========================================== #
# ======================================================================================================== #

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True


# ======================================================================================================== #
# ====================================== CENTRAL TOOLHEAD PARKING ======================================== #
# ======================================================================================================== #

[gcode_macro EXECUTE_PARKING]
description: Centralized parking logic for different contexts
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONFIG = printer.configfile.settings %}
    {% set TYPE = params.TYPE|default('TYPE')|lower %}
    {% set Z_HOP = macrocfg.z_hop_distance %}
    {% set FILAMENT_PARK_X = macrocfg.filament_park_x %}
    {% set FILAMENT_PARK_Y = macrocfg.filament_park_y %}
    {% set PARK_X = macrocfg.park_x %}
    {% set PARK_Y = macrocfg.park_y %}
    {% set PARK_Z = macrocfg.park_z %}
    {% set TRAVEL_FAST = macrocfg.travel_fast %}
    {% set PURGE_X = macrocfg.purge_x %}
    {% set PURGE_Y = macrocfg.purge_y %}
    {% set PURGE_Z = macrocfg.purge_z_offset %}
    {% set BLOBIFIER_SAFE_X = macrocfg.blobifier_safe_x %}
    {% set BLOBIFIER_SAFE_Y = macrocfg.blobifier_safe_y %}
    {% set BLOBIFIER_PURGE_X = macrocfg.blobifier_purge_x %}
    {% set BLOBIFIER_PURGE_Y = macrocfg.blobifier_purge_y %}
    {% set BLOBIFIER_PURGE_Z = macrocfg.blobifier_purge_z %}
    {% set BLOBIFIER_PURGE_START = macrocfg.blobifier_purge_start %}
    {% set PARK_ZMIN = macrocfg.park_zmin %}
    {% set BELT_TEST_Y = macrocfg.belt_test_y %}
    {% set BELT_TEST_Z = macrocfg.belt_test_z %}
    {% set TYPE = params.TYPE|default('TYPE')|lower %}
    {% set PHASE = macrocfg.parking_phase|default('FULL')|upper %}
    
    # Auto-calculate center positions for -128 values
    {% if PARK_X == -128 %}
        {% set PARK_X = CONFIG.stepper_x.position_max / 2 %}
    {% endif %}

    {% if PARK_Y == -128 %}
        {% set PARK_Y = CONFIG.stepper_y.position_max / 2 %}
    {% elif PARK_Y == -256 %}
        {% set PARK_Y = CONFIG.stepper_y.position_max %}
    {% endif %}

    {% if FILAMENT_PARK_X == -128 %}
        {% set FILAMENT_PARK_X = CONFIG.stepper_x.position_max / 2 %}
    {% endif %}

    {% if FILAMENT_PARK_Y == -128 %}
        {% set FILAMENT_PARK_Y = CONFIG.stepper_y.position_max / 2 %}
    {% elif FILAMENT_PARK_Y == -256 %}
        {% set FILAMENT_PARK_Y = CONFIG.stepper_y.position_min %}
    {% endif %}

    # Determine parking coordinates based on type
    {% if TYPE == 'color_change' %}
        _CG28
        {% set PARK_X = FILAMENT_PARK_X %}
        {% set PARK_Y = FILAMENT_PARK_Y %}
        {% set PARK_Z = PARK_Z %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to color change position"
        # Save current temperature for filament operations
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=filament_m600_prev_temp VALUE={printer.extruder.target}
    
    {% elif TYPE == 'purge_standard' %}
        _CG28
        # Position for standard purge operations - use purge coordinates
        {% set PARK_X = PURGE_X %}
        {% set PARK_Y = PURGE_Y %}
        {% set PARK_Z = PURGE_Z %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to standard purge position"
    
    {% elif TYPE == 'purge_blobifier' %}
        _CG28
        # Position for blobifier purge operations
        {% set SAFE_X = BLOBIFIER_SAFE_X %}
        {% set SAFE_Y = BLOBIFIER_SAFE_Y %}
        {% set PARK_X = BLOBIFIER_PURGE_X %}
        {% set PARK_Y = BLOBIFIER_PURGE_Y %}
        {% set PARK_Z = BLOBIFIER_PURGE_Z %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to blobifier purge position"
    
    {% elif TYPE == 'belt_tension' %}
        _CG28
        # Position for belt tension testing
        {% set PARK_X = CONFIG.stepper_x.position_max|float / 2 %}
        {% set PARK_Y = BELT_TEST_Y %}
        {% set PARK_Z = BELT_TEST_Z %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to belt tension position"
        RESPOND MSG="Target belt tensions:"
        RESPOND MSG="Z belts: 2.5 - 2.8"
        RESPOND MSG="A/B belts: 1.8 - 2.2"
    
    {% elif TYPE == 'soak' %}
        _CG28
        # Position after heat soak - centered and 5mm off bed
        {% set PARK_X = CONFIG["stepper_x"]["position_max"]|float / 2.0 %}
        {% set PARK_Y = CONFIG["stepper_y"]["position_max"]|float / 2.0 %}
        {% set PARK_Z = 5.0 %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to soak position"
    
    {% elif TYPE == 'center' %}
        _CG28
        {% set PARK_X = printer.toolhead.axis_maximum.x|float / 2.0 %}
        {% set PARK_Y = printer.toolhead.axis_maximum.y|float / 2.0 %}
        {% set PARK_Z = printer.toolhead.axis_maximum.z|float / 2.0 %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to center position"
    
    {% elif TYPE == 'park' %}
        _CG28
        # Standard parking coordinates
        {% set PARK_X = PARK_X %}
        {% set PARK_Y = PARK_Y %}
        {% set PARK_Z = PARK_Z %}
        {% set TRAVEL_SPEED = TRAVEL_FAST %}
        RESPOND MSG="Moving to park position"
    
    {% else %}
        RESPOND MSG="Please select the type of parking. Acceptable options are:"  
        RESPOND MSG="PARK, SOAK, CENTER, BELT_TENSION, COLOR_CHANGE,"
        RESPOND MSG="PURGE_STANDARD, PURGE_BLOBIFIER"
        {% set SKIP_PARKING = true %}
    {% endif %}
    
    # Execute parking movement only if valid type
    {% if SKIP_PARKING is not defined %}
        G90                                                         # Absolute positioning
        {% if TYPE == 'color_change' %}
            # Color change parking split into two phases
            {% if PHASE == 'Z_RAISE' %}
                # PHASE 1: Only do relative Z raise (before cutting)
                RESPOND MSG="Phase 1: Raising Z for color change"
                G91                                                 # Relative positioning
                {% if printer.toolhead.position.z|float + PARK_Z|float < CONFIG["stepper_z"]["position_max"]|float %}
                    {% if printer.toolhead.position.z < PARK_ZMIN|int %}
                        G0 Z{PARK_ZMIN|int - printer.toolhead.position.z|int}
                    {% else %}
                        G0 Z{PARK_Z|int}
                    {% endif %}
                {% endif %}
                G90                                                 # Back to absolute
            {% elif PHASE == 'XY_MOVE' %}
                # PHASE 2: Move to XY position (after cutting)
                RESPOND MSG="Phase 2: Moving to park XY position"
                G0 X{PARK_X} Y{PARK_Y} F{TRAVEL_SPEED}              # Move to XY position
            {% else %}
                # FULL: Both Z raise and XY move (legacy support)
                G91                                                 # Relative positioning
                {% if printer.toolhead.position.z|float + PARK_Z|float < CONFIG["stepper_z"]["position_max"]|float %}
                    {% if printer.toolhead.position.z < PARK_ZMIN|int %}
                        G0 Z{PARK_ZMIN|int - printer.toolhead.position.z|int}
                    {% else %}
                        G0 Z{PARK_Z|int}
                    {% endif %}
                {% endif %}
                G90                                                 # Back to absolute
                G0 X{PARK_X} Y{PARK_Y} F{TRAVEL_SPEED}              # Move to XY position
            {% endif %}
        {% elif TYPE == 'purge_blobifier' %}
            # Blobifier safe raise, then park
            G1 X{SAFE_X} Y{SAFE_Y} F{TRAVEL_SPEED}
            G1 X{PARK_X} Y{PARK_Y} Z{PARK_Z} F{TRAVEL_SPEED}
        {% else %}
            # Standard absolute positioning for all other types
            G1 Z{Z_HOP} F{TRAVEL_SPEED}
            G1 X{PARK_X} Y{PARK_Y} Z{PARK_Z} F{TRAVEL_SPEED}
        {% endif %}
        
        M400
    {% endif %}


# ======================================================================================================== #
# ============================================== UNSAFE RAISE ============================================ #
# ======================================================================================================== #

[gcode_macro UNSAFE_RAISE_TOOL]
description: Emergency Z-raise without homing (moves all Z motors simultaneously)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set Z = params.Z|default(macrocfg.emergency_z_raise)|float %}
    {% set Z_SPEED = macrocfg.z_speed %}
    
    RESPOND MSG="⚠️ WARNING: Raising toolhead {Z}mm without homing"
    
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0
    
    G91                                                         # Relative positioning
    G0 Z{Z} F{Z_SPEED}                                          # Raise Z by specified amount
    G90                                                         # Back to absolute positioning
    M84                                                         # Disable motors


# ======================================================================================================== #
# ======================================== VERIFY EXTRUDER TEMP ========================================== #
# ======================================================================================================== #

[gcode_macro _VERIFY_EXTRUDE_TEMP]
description: Centralized temperature verification before extrusion operations
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONFIG = printer.configfile.settings %}
    {% set VERIFY_ENABLED = macrocfg.verify_temp_enabled %}
    {% set TARGET = params.TARGET|default(0)|float %}
    {% set TOLERANCE = params.tolerance|default(macrocfg.temp_tolerance)|float %}
    {% set WAIT = params.WAIT|default('true')|lower %}
    {% set REQUIRED_TEMP = params.REQUIRED_TEMP|default(0)|float %}
    {% set CUR_TEMP = printer.extruder.temperature|float %}
    {% set CUR_TARGET = printer.extruder.target|float %}
    {% set MIN_EXTRUDE = macrocfg.min_extrude_temp|int %}
    {% set IN_M600 = macrocfg.in_m600_context %}  # Capture the flag
    
    {% if VERIFY_ENABLED == True %}
        # Determine target temperature with new logic
        {% if TARGET > 0 %}
            # Explicit TARGET parameter takes priority
            {% set REQUIRED_TEMP = TARGET %}
        {% elif CUR_TARGET >= MIN_EXTRUDE %}
            # If extruder already has a valid target temp, keep it
            {% set REQUIRED_TEMP = CUR_TARGET %}
        {% else %}
            # No valid target set, use minimum extrude temp
            {% set REQUIRED_TEMP = MIN_EXTRUDE %}
            RESPOND MSG="No target temp set, using minimum: {MIN_EXTRUDE}C"
        {% endif %}
        
        # Check if current temp is within tolerance
        {% if CUR_TEMP < (REQUIRED_TEMP - TOLERANCE) %}
            {% if WAIT == 'true' %}
                {% if IN_M600 == True %}
                    _SET_LED_STATUS STATUS=HEATING_M600
                {% else %}
                    _SET_LED_STATUS STATUS=HEATING
                {% endif %}
                
                RESPOND MSG="🔥 Heating to {REQUIRED_TEMP|int}C (current: {CUR_TEMP|int}C)"
                M109 S{REQUIRED_TEMP}
                
                {% if IN_M600 == True %}
                    _SET_LED_STATUS STATUS=M600
                {% else %}
                    _SET_LED_STATUS STATUS=STANDBY
                {% endif %}
            {% else %}
                RESPOND MSG="⚠️ Warning: Temperature too low - {CUR_TEMP|int}C (need {REQUIRED_TEMP|int}C)"
            {% endif %}
        {% endif %}
    {% endif %}


# ======================================================================================================== #
# ======================================== SYSTEM INITIALIZATION ========================================= #
# ======================================================================================================== #

[gcode_macro _INITIALIZE]
description: Clear all pending delayed operations and reset system state for clean print start
gcode:
    # Clear all potentially running delayed gcode operations to prevent interference
    RESPOND MSG="Initializing print start - clearing pending operations"

    # Cancel filament loading operations
    UPDATE_DELAYED_GCODE ID=CONTINUE_EXTRUSION DURATION=0
    UPDATE_DELAYED_GCODE ID=CONTINUE_WAITING DURATION=0

    # Cancel filament sensor operations
    UPDATE_DELAYED_GCODE ID=_DELAYED_FILAMENT_SENSOR DURATION=0

    # Cancel fan timer if running
    UPDATE_DELAYED_GCODE ID=_SCRUBBER_TIMER DURATION=0
    UPDATE_DELAYED_GCODE ID=_AIR_FILTER_TIMER DURATION=0
    UPDATE_DELAYED_GCODE ID=_AIR_FILTER_FLUSH_TIMER DURATION=0

    # Cancel heat soak timer if running
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=0

    # Reset any filament operation counters
    SET_GCODE_VARIABLE MACRO=_EXTRUDE_TO_HOTEND VARIABLE=extrusion_count VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHECK_FILAMENT_FOR_PRINT_START VARIABLE=waiting_for_filament VALUE=False

    RESPOND MSG="✅ System initialization complete"
  

# ======================================================================================================== #
# ============================================ IDLE MANAGEMENT =========================================== #
# ======================================================================================================== #

[gcode_macro _IDLER]
description: Set printer to idle state with configurable shutdowns
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set POWER = macrocfg.idle_power|lower %}
    {% set BED = macrocfg.idle_bed|lower %}
    {% set EXTRUDER = macrocfg.idle_extruder|lower %}
    {% set STEPPERS = macrocfg.idle_steppersS|lower %}
    
    RESPOND MSG="💤 Entering idle mode"
    
    # Complete power shutdown sequence
    {% if POWER == 'true' %}
        M84                                                     # Disable steppers  
        TURN_OFF_HEATERS                                        # Turn off all heaters
    {% endif %}
    
    # Individual component shutdowns
    {% if STEPPERS == 'true' %}
        M84                                                     # Disable steppers only
    {% endif %}
    
    {% if BED == 'true' %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed                # Turn off bed heater
    {% endif %}
    
    {% if EXTRUDER == 'true' %}
        SET_HEATER_TEMPERATURE HEATER=extruder                  # Turn off extruder heater
    {% endif %}

    _SET_LED_STATUS STATUS=STANDBY


# ======================================================================================================== #
# ============================================== AUDIO TUNE ============================================== #
# ======================================================================================================== #

[gcode_macro _PLAY_TUNE]
description: Centralized audio notification system with multiple tune types
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUDIO_STATUS = macrocfg.audio_status %}
    {% set TYPE = params.TYPE|default('beep')|lower %}
    
    {% if AUDIO_STATUS == True %}
        {% if TYPE == 'mario' %}
            # Mario coin: chirp chirp chirp LOOONG (friendly boot-up)
            SET_PIN PIN=beeper VALUE=1
            G4 P60
            SET_PIN PIN=beeper VALUE=0
            G4 P60
            SET_PIN PIN=beeper VALUE=1
            G4 P60
            SET_PIN PIN=beeper VALUE=0
            G4 P60
            SET_PIN PIN=beeper VALUE=1
            G4 P60
            SET_PIN PIN=beeper VALUE=0
            G4 P150
            SET_PIN PIN=beeper VALUE=1
            G4 P400
            SET_PIN PIN=beeper VALUE=0
            RESPOND MSG="Playing Mario tune"
            
        {% elif TYPE == 'change' %}
            # Three beeps: short short short 
            SET_PIN PIN=beeper VALUE=1
            G4 P100
            SET_PIN PIN=beeper VALUE=0
            G4 P100
            SET_PIN PIN=beeper VALUE=1
            G4 P100
            SET_PIN PIN=beeper VALUE=0
            G4 P100
            SET_PIN PIN=beeper VALUE=1
            G4 P100
            SET_PIN PIN=beeper VALUE=0
            RESPOND MSG="Playing change tune"
            
        {% elif TYPE == 'error' %}
            # Error: LONG pause LONG pause LONG (ominous, slow)
            SET_PIN PIN=beeper VALUE=1
            G4 P500
            SET_PIN PIN=beeper VALUE=0
            G4 P300
            SET_PIN PIN=beeper VALUE=1
            G4 P500
            SET_PIN PIN=beeper VALUE=0
            G4 P300
            SET_PIN PIN=beeper VALUE=1
            G4 P500
            SET_PIN PIN=beeper VALUE=0
            RESPOND MSG="Playing error tune"
            
        {% else %}
            RESPOND MSG="⚠️ Unknown tune type: {TYPE}"
        {% endif %}
    {% else %}
        RESPOND MSG="🔇 Audio is disabled in config"
    {% endif %}


[delayed_gcode _BEEP_LOOP]
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set BEEP_ENABLED = macrocfg.beep_enabled %}
    
    {% if BEEP_ENABLED == True %}
        # Repeating alert beep pattern
        SET_PIN PIN=beeper VALUE=1
        G4 P200
        SET_PIN PIN=beeper VALUE=0
        UPDATE_DELAYED_GCODE ID=_BEEP_LOOP DURATION=2
    {% endif %}


# ======================================================================================================== #
# ======================================= HEATER CONTROL OVERRIDES ======================================= #
# ======================================================================================================== #

[gcode_macro M109]
description: Wait for hotend temperature with feedback
rename_existing: M99109
gcode:
    {% set S = params.S|float %}
    M104 {rawparams}
    {% if S != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={S} MAXIMUM={S+1}
    {% endif %}


# ======================================================================================================== #
# ==================================== CHAMBER CONFIGURATION CONTROL ===================================== #
# ======================================================================================================== #

[gcode_macro _SET_CHAMBER_CONTROL]
description: Internal chamber control for multiple sensor types
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set config = printer.configfile.settings %}
    {% set TEMP = params.TEMP | default(macrocfg.chamber_temp) | float %}
    {% set WAIT = params.WAIT | default('False') | lower %}
    {% set SPEED = params.SPEED | default(0) | float %}
    {% set CHAMBER_TYPE = macrocfg.chamber_type %}
    {% set CHAMBER_NAME = macrocfg.chamber_name %}
    {% set TEMP_TOLERANCE = macrocfg.temp_tolerance %}
    {% set DEBUGGING = macrocfg.debugging %}
    {% set CHAMBER = CHAMBER_TYPE + ' ' + CHAMBER_NAME %}
    
    # Chamber control based on sensor type
    {% if CHAMBER_TYPE == 'generic_fan' %}
        SET_FAN_SPEED FAN={CHAMBER_NAME} SPEED={SPEED}
    
    {% elif CHAMBER_TYPE == 'temperature_fan' %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan={CHAMBER_NAME} TARGET={TEMP}
        {% if WAIT == 'true' %}
            TEMPERATURE_WAIT SENSOR='{CHAMBER}' MINIMUM={TEMP} MAXIMUM={TEMP + TEMP_TOLERANCE}
        {% endif %}
        SET_FAN_SPEED FAN={CHAMBER_NAME} SPEED={SPEED}
    
    {% elif CHAMBER_TYPE == 'heater' %}
        SET_HEATER_TEMPERATURE HEATER={CHAMBER_NAME} TARGET={TEMP}
        {% if WAIT == 'true' %}
            TEMPERATURE_WAIT SENSOR='{CHAMBER}' MINIMUM={TEMP} MAXIMUM={TEMP + TEMP_TOLERANCE}
        {% endif %}
    
    {% elif CHAMBER_TYPE == 'temperature_sensor' %}
        {% if WAIT == 'true' %}
            TEMPERATURE_WAIT SENSOR='{CHAMBER}' MINIMUM={TEMP} MAXIMUM={TEMP + TEMP_TOLERANCE}
        {% endif %}
    
    {% elif CHAMBER_TYPE == 'z_thermal_adjust' %}
        {% set chamber = CHAMBER_TYPE %}
        {% if WAIT == 'true' %}
            TEMPERATURE_WAIT SENSOR='{CHAMBER}' MINIMUM={TEMP} MAXIMUM={TEMP + TEMP_TOLERANCE}
        {% endif %}
    {% endif %}
    
    {% if DEBUGGING == True %}
        RESPOND MSG="🌡️ Chamber: {CHAMBER} | Temp: {TEMP} | Wait: {WAIT} | Speed: {SPEED}"
    {% endif %}


# ======================================================================================================== #
# ========================================= PRINT STATE DETECTION ======================================== #
# ======================================================================================================== #

[gcode_macro _GET_PRINT_STATE]
description: Centralized print state detection for all macros
gcode:
    # Get multiple state indicators
    {% set SD_PROGRESS = printer.virtual_sdcard.progress %}
    {% set PRINT_STATE = printer.print_stats.state|lower %}
    {% set FILENAME = printer.print_stats.filename %}
    {% set PRINT_DURATION = printer.print_stats.total_duration %}
    
    # Determine if we're mid-print using multiple fallbacks
    {% set IN_PRINT = (PRINT_STATE == "printing") or (PRINT_STATE == "paused") or (SD_PROGRESS > 0 and SD_PROGRESS < 1.0) or (FILENAME|length > 0 and PRINT_DURATION > 0) %}
    
    # Store the result for other macros to use
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=currently_printing VALUE={1 if IN_PRINT else 0}


[gcode_macro _MANAGE_PRINT_STATE]
description: Centralized print state management for filament operations
gcode:
    {% set STATE = params.STATE|default('unknown')|lower %}
    
    {% if STATE == 'start' %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=starting_print VALUE=1
        RESPOND MSG="Print state: Starting"
    {% elif STATE == 'end' %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=stating_print VALUE=0
        RESPOND MSG="Print state: Ending"
    {% elif STATE == 'pause' %}
        # Handle pause state logic
        RESPOND MSG="Print state: Paused"
    {% elif STATE == 'resume' %}
        # Handle resume state logic
        RESPOND MSG="Print state: Resuming"
    {% endif %}


# ======================================================================================================== #
# ============================================ SET LED STATUS ============================================ #
# ======================================================================================================== #

[gcode_macro _SET_LED_STATUS]
description: Centralized LED status management
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set STATUS = params.STATUS|default('standby')|lower %}
    {% set LED_STATUS = macrocfg.led_status %}
    
    {% if LED_STATUS == True %}
        {% if STATUS == 'standby' %}
            _STATUS_STANDBY
        {% elif STATUS == 'calibrating' %}
            _STATUS_CALIBRATING
        {% elif STATUS == 'heating' %}
            _STATUS_HEATING
        {% elif STATUS == 'heating_m600' %}
            _STATUS_HEATING_M600
        {% elif STATUS == 'heating_with_progress' %}
            _STATUS_HEATING_WITH_PROGRESS
        {% elif STATUS == 'cooling' %}
            _STATUS_COOLING
        {% elif STATUS == 'printing' %}
            _STATUS_PRINTING
        {% elif STATUS == 'printing_with_progress' %}
            _STATUS_PRINTING_WITH_PROGRESS
        {% elif STATUS == 'error' %}
            _STATUS_ERROR
        {% elif STATUS == 'finished' %}
            _STATUS_FINISHED
        {% elif STATUS == 'm600' %}
            _STATUS_M600
        {% endif %}
    {% endif %}