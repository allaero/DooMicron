# ======================================================================================================== #
# ======================================= FILAMENT SENSOR CONTROL ======================================== #
# ======================================================================================================== #

[gcode_macro _ENABLE_FILAMENT_SENSOR]
description: Enable filament sensors with delay
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUTO_FILAMENT_DELAY = macrocfg.auto_filament_delay %}

    UPDATE_DELAYED_GCODE ID=_DELAYED_FILAMENT_SENSOR DURATION={AUTO_FILAMENT_DELAY}


[delayed_gcode _DELAYED_FILAMENT_SENSOR]
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set UPPER_SENSOR = macrocfg.upper_filament_sensor %}
    {% set LOWER_SENSOR = macrocfg.lower_filament_sensor %}
    
    RESPOND MSG="Enabling filament sensors"
    SET_FILAMENT_SENSOR SENSOR={UPPER_SENSOR} ENABLE=1
    SET_FILAMENT_SENSOR SENSOR={LOWER_SENSOR} ENABLE=1


[gcode_macro _DISABLE_FILAMENT_SENSOR]
description: Disable filament sensors immediately
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set UPPER_SENSOR = macrocfg.upper_filament_sensor %}
    {% set LOWER_SENSOR = macrocfg.lower_filament_sensor %}
    
    RESPOND MSG="Disabling filament sensors"
    SET_FILAMENT_SENSOR SENSOR={UPPER_SENSOR} ENABLE=0
    SET_FILAMENT_SENSOR SENSOR={LOWER_SENSOR} ENABLE=0


[delayed_gcode DISABLE_FILAMENT_SENSOR_ON_STARTUP]
initial_duration: 1.0
gcode:
    _DISABLE_FILAMENT_SENSOR


[gcode_macro _DETECT_FILAMENT_SENSORS]
description: Centralized filament sensor state detection
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set UPPER_FILAMENT_SENSOR = macrocfg.upper_filament_sensor %}
    {% set LOWER_FILAMENT_SENSOR = macrocfg.lower_filament_sensor %}
    
    # Get sensor states
    {% set UPPER_DETECTED = printer["filament_switch_sensor " + UPPER_FILAMENT_SENSOR].filament_detected %}
    {% set LOWER_DETECTED = printer["filament_switch_sensor " + LOWER_FILAMENT_SENSOR].filament_detected %}
    
    # Store states for calling macro to use
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=upper_sensor_state VALUE={1 if UPPER_DETECTED else 0}
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=lower_sensor_state VALUE={1 if LOWER_DETECTED else 0}
    
    #RESPOND MSG="DEBUG: Sensor states - Upper: {UPPER_DETECTED}, Lower: {LOWER_DETECTED}"


# ======================================================================================================== #
# ======================================= FILAMENT RUNOUT HANDLING ======================================= #
# ======================================================================================================== #

[gcode_macro _FILAMENT_RUNOUT]
description: Handle filament runout sensor trigger
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set FILAMENT_M600_COLDSTART = macrocfg.filament_m600_coldstart %}
    {% set IDLE_TIME = macrocfg.idle_time %}
    {% set AUDIO_STATUS = macrocfg.audio_status %}
    {% set FILAMENT_M600_AUDIO = macrocfg.filament_m600_audio %}
    {% set AUTO_UNLOAD = macrocfg.auto_unload %}
    {% set FILAMENT_M600_UNLOAD_SPEED = macrocfg.filament_retract_fast %}
    {% set FILAMENT_M600_UNLOAD_LENGTH = macrocfg.filament_m600_unload_length %}
    {% set USE_FLUIDD = macrocfg.use_fluidd %}
    {% set AUDIO_FREQUENCY = macrocfg.audio_frequency %}
    
    {% if FILAMENT_M600_COLDSTART == 0 %}
        RESPOND MSG="⚠️ Filament runout detected"
        
        SET_IDLE_TIMEOUT TIMEOUT={IDLE_TIME}
        
        {% if AUDIO_STATUS == True %}
    	    _PLAY_TUNE TYPE=error
        {% endif %}
        
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=filament_m600_prev_temp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=runout VALUE=1
        
        {% if AUTO_UNLOAD == True %}
            RESPOND MSG="Auto-unloading filament"
            G91                                                 # Relative positioning
            G1 E-{FILAMENT_M600_UNLOAD_LENGTH} F{FILAMENT_M600_UNLOAD_SPEED}
            G90 
        {% else %}
            {% if USE_FLUIDD == True and FILAMENT_M600_COLDSTART == 0 %}
                RESPOND MSG="⚠️ Run FILAMENT_UNLOAD to unload"
                {% if AUDIO_STATUS == True and AUDIO_FREQUENCY > 0 %}
                    RESPOND MSG="⚠️ Run _ALERT_BEEP_OFF to silence beeper"
                {% endif %}
            {% endif %}
            M109 S0                                             # Turn off extruder
        {% endif %}
        EXECUTE_PARKING TYPE=COLOR_CHANGE
    {% endif %}
