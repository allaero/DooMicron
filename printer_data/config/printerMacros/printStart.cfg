# ======================================================================================================== #
# ====================================== MAIN START PRINT SEQUENCE ======================================= #
# ======================================================================================================== #

[gcode_macro _START_PRINT_1]
description: First phase of print start - setup through filament loading
gcode: 
    # Initialize print start process
    _MANAGE_PRINT_STATE STATE=start
    _INITIALIZE

    # Set initial status and clear any pause state
    _SET_LED_STATUS STATUS=STANDBY
    CLEAR_PAUSE
    
    # Establish coordinate and extrusion modes
    G90                                                         # Absolute coordinates
    M83                                                         # Relative extrusion
    
    # Execute preparation sequence
    _HEAT_SURFACE                                               # Heat bed and preheat extruder
    _PREP_CHAMBER                                               # Prepare chamber heating/soaking
    _PREP_FANS                                                  # Configure cooling fans
    _PREP_SURFACE                                               # Homing, calibration, meshing
    _PREP_EXTRUDER                                              # Heat nozzle and handle filament


# ======================================================================================================== #
# =========================================== SURFACE HEATING ============================================ #
# ======================================================================================================== #

[gcode_macro _HEAT_SURFACE]
description: Heat bed and preheat extruder for print preparation
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set BED_TEMP = macrocfg.bed_temp %}
    {% set EXTRUDER_PREHEAT_TEMP = macrocfg.extruder_preheat_temp %}
    {% set BED_FAN = macrocfg.bed_fan %}
    {% set TEMP_TOLERANCE = macrocfg.temp_tolerance %}

    _CG28

    {% if BED_TEMP > 0 %}
        _SET_LED_STATUS STATUS=HEATING
    
        # Extruder preheating if configured
        {% if EXTRUDER_PREHEAT_TEMP > 0 %}
            RESPOND MSG="🌡️ Warming extruder: {EXTRUDER_PREHEAT_TEMP|int}°C"
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_PREHEAT_TEMP}
        {% endif %}

        # Bed heating sequence
        RESPOND MSG="🔥 Heating bed: {BED_TEMP|int}°C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    
        {% if BED_FAN == True %}
            _BEDFANSSLOW                                         # Start bed fans at low speed
        {% endif %}
    
        # Calculate clean variables for temperature waiting
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1} MAXIMUM={BED_TEMP + TEMP_TOLERANCE}
    
        {% if BED_FAN == True %}
            _BEDFANSFAST                                         # Increase bed fan speed
        {% endif %}
    {% endif %}

    _SET_LED_STATUS STATUS=STANDBY


# ======================================================================================================== #
# ========================================= CHAMBER PREPARATION ========================================== #
# ======================================================================================================== #

[gcode_macro _PREP_CHAMBER]
description: Prepare chamber heating and initiate heat soak if configured
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CHAMBER = macrocfg.chamber %}
    {% set CHAMBER_TEMP = macrocfg.chamber_temp %}
    {% set CHAMBER_TYPE = macrocfg.chamber_type %}
    {% set CHAMBER_NAME = macrocfg.chamber_name %}
    {% set HEAT_SOAK = macrocfg.heat_soak %}
    {% set HEAT_SOAK_INITIAL_TEMP = macrocfg.heat_soak_initial_temp %}
    {% set BED_TEMP = macrocfg.bed_temp %}
    
    {% if CHAMBER == True and CHAMBER_TEMP != 0 %}
        # Update progress bar for chamber heating with stored initial temperature
        _SET_LED_STATUS STATUS=HEATING_WITH_PROGRESS INITIAL_TEMP={HEAT_SOAK_INITIAL_TEMP} TARGET_TEMP={CHAMBER_TEMP}    
        
        # Set chamber target temperature based on sensor type
        {% if CHAMBER_TYPE == 'temperature_fan' %}
            SET_TEMPERATURE_FAN_TARGET temperature_fan={CHAMBER_NAME} target={CHAMBER_TEMP}
        {% elif CHAMBER_TYPE == 'heater_generic' %}
            SET_HEATER_TEMPERATURE HEATER={CHAMBER_NAME} TARGET={CHAMBER_TEMP}
        {% endif %}
    
        # Initiate heat soak sequence if enabled
        {% if HEAT_SOAK == True %}
            SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=heat_soak_complete VALUE=0
            _HEAT_SOAK
        {% endif %}
    {% endif %}


# ======================================================================================================== #
# ============================================== HEAT SOAK =============================================== #
# ======================================================================================================== #

[gcode_macro _HEAT_SOAK]
description: Control chamber heat soak with time or temperature based soaking
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CHAMBER_NAME = macrocfg.chamber_name %}
    {% set CHAMBER_TYPE = macrocfg.chamber_type %}
    {% set EXTRUDER_PREHEAT_TEMP = macrocfg.extruder_preheat_temp %}
    {% set TIME_SOAK = macrocfg.time_soak %}
    {% set TEMP_SOAK = macrocfg.temp_soak %}
    {% set CHAMBER_TEMP = params.TEMP | default(macrocfg.chamber_temp) | float %}
    {% set BED_TEMP = macrocfg.bed_temp %}
    {% set CHAMBER_TIME = macrocfg.chamber_time %}
    {% set TIME = params.TIME | default(CHAMBER_TIME) | float %}
    {% set STARTING_PRINT = macrocfg.starting_print %}
    {% set HEAT_SOAK_FAN_SPEED = macrocfg.heat_soak_fan_speed %}
    {% set HEAT_SOAK_BED_TEMP = macrocfg.heat_soak_bed_temp %}
    
    # Parameter processing for manual heat soak calls
    {% if params.SENSOR is defined %}
        {% set SENSOR = params.SENSOR | default(CHAMBER_NAME) | lower %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=chamber_name VALUE={SENSOR}
    {% endif %}
    
    {% if params.SENSOR_TYPE is defined %}
        {% set SENSOR_TYPE = params.SENSOR_TYPE | default(CHAMBER_TYPE) | lower %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=chamber_type VALUE={SENSOR_TYPE}
    {% endif %}
    
    {% if params.EXTRUDER is defined %}
        {% set PRE_TEMP = params.EXTRUDER | default(EXTRUDER_PREHEAT_TEMP) | float %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=extruder_preheat_temp VALUE={PRE_TEMP}
    {% endif %}
    
    # Configure soak type (time-based or temperature-based)
    {% if params.TIME is defined %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=time_soak VALUE=1
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=temp_soak VALUE=0
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=chamber_time VALUE={TIME}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=time_soak VALUE=0
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=temp_soak VALUE=1
    {% endif %}
    
    # Set target temperatures (but don't apply bed temp yet - use soak temp first)
    {% set TEMP = params.TEMP | default(CHAMBER_TEMP) | float %}
    {% set BED = params.BED | default(BED_TEMP) | float %}
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=chamber_temp VALUE={TEMP}
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=bed_temp VALUE={BED}

    # Set chamber temperature based on sensor type
    {% if CHAMBER_TYPE == 'temperature_fan' %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan={CHAMBER_NAME} target={CHAMBER_TEMP}
    {% elif CHAMBER_TYPE == 'heater_generic' %}
        SET_HEATER_TEMPERATURE HEATER={CHAMBER_NAME} TARGET={CHAMBER_TEMP}
    {% endif %}
    
    # Pre-soak setup for standalone heat soak calls
    {% if STARTING_PRINT|int == 0 %}  
        # Store initial temperature for progress tracking
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=heat_soak_initial_temp VALUE={printer['temperature_sensor Chamber'].temperature}
        
        # Enable progress bar for standalone heat soak
        _STATUS_HEATING_WITH_PROGRESS INITIAL_TEMP={printer['temperature_sensor Chamber'].temperature} TARGET_TEMP={CHAMBER_TEMP}
        
        G28
        M106 S{HEAT_SOAK_FAN_SPEED}
    {% endif %}
    
    # Always heat bed to soak temp first
    RESPOND MSG="🔥 Heating bed to {HEAT_SOAK_BED_TEMP}C for fast soak"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={HEAT_SOAK_BED_TEMP}

    # Heat extruder to preheat temperature
    RESPOND MSG="🔥 Heating extruder to {EXTRUDER_PREHEAT_TEMP}C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_PREHEAT_TEMP}
    
    # Move to soak position
    EXECUTE_PARKING TYPE=SOAK
    
    # Execute the actual soaking procedure at soak temp
    M106 S{HEAT_SOAK_FAN_SPEED}
    _DO_SOAK
    M106 S0
    
    # After chamber soak complete, adjust bed to final target temp
    {% if BED != HEAT_SOAK_BED_TEMP %}
        RESPOND MSG="Chamber soak complete - adjusting bed to final temp: {BED}C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}
    {% endif %}


[gcode_macro _HEAT_SOAK_MAINSAIL]
description: Manual heat soak for Mainsail - heats without waiting
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set BED_TEMP = macrocfg.bed_temp %}
    {% set EXTRUDER_TEMP = macrocfg.extruder_preheat_temp %}
    {% set CHAMBER_TEMP = macrocfg.chamber_temp %}
    {% set BED_FAN = macrocfg.bed_fan %}
    {% set CHAMBER = macrocfg.chamber %}
    {% set CHAMBER_TYPE = macrocfg.chamber_type %}
    {% set CHAMBER_NAME = macrocfg.chamber_name %}
    {% set HEAT_SOAK_FAN_SPEED = macrocfg.heat_soak_fan_speed %}
    
    RESPOND MSG="Starting manual heat soak"
    
    # Home printer
    G28
    
    # Move to heat soak position
    EXECUTE_PARKING TYPE=SOAK
    
    # Start heating bed
    {% if BED_TEMP > 0 %}
        RESPOND MSG="🔥 Heating bed to {BED_TEMP|int}C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    {% endif %}
    
    # Start heating extruder
    {% if EXTRUDER_TEMP > 0 %}
        RESPOND MSG="🔥 Heating extruder to {EXTRUDER_TEMP|int}C"
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    {% endif %}
    
    # Start chamber heating if configured
    {% if CHAMBER == True and CHAMBER_TEMP > 0 %}
        RESPOND MSG="Setting chamber target to {CHAMBER_TEMP|int}C"
        {% if CHAMBER_TYPE == 'temperature_fan' %}
            SET_TEMPERATURE_FAN_TARGET temperature_fan={CHAMBER_NAME} target={CHAMBER_TEMP}
        {% elif CHAMBER_TYPE == 'heater_generic' %}
            SET_HEATER_TEMPERATURE HEATER={CHAMBER_NAME} TARGET={CHAMBER_TEMP}
        {% endif %}
    {% endif %}
    
    # Turn on part cooling fan
    M106 S{HEAT_SOAK_FAN_SPEED}
    
    # Turn on bed fans
    {% if BED_FAN == True %}
        _BEDFANSFAST
    {% endif %}
    
    RESPOND MSG="Heat soak started - no wait lock"
    RESPOND MSG="Bed: {BED_TEMP|int}C, Extruder: {EXTRUDER_TEMP|int}C"

[gcode_macro _DO_SOAK]
description: Execute the actual heat soak procedure
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set TIME_SOAK = macrocfg.time_soak %}
    {% set TEMP_SOAK = macrocfg.temp_soak %}
    {% set CHAMBER_TIME = macrocfg.chamber_time %}
    {% set SOAK_IDLE_TIME = macrocfg.soak_idle_time %}
    {% set BED_FAN = macrocfg.bed_fan %}
    {% set CHAMBER_TEMP = macrocfg.chamber_temp %}
    {% set HEAT_SOAK_INITIAL_TEMP = macrocfg.heat_soak_initial_temp %}
    {% set BED_TEMP = macrocfg.bed_temp %}
    {% set HEAT_SOAK_COMPLETE = macrocfg.heat_soak_complete %}
    
    # Update progress bar for heat soak process
    _SET_LED_STATUS STATUS=HEATING_WITH_PROGRESS INITIAL_TEMP={HEAT_SOAK_INITIAL_TEMP} TARGET_TEMP={BED_TEMP}
      
    {% if TEMP_SOAK == True %}
        {% if BED_FAN == True %}
            _BEDFANSFAST
        {% endif %}
        RESPOND MSG="Soaking chamber: {CHAMBER_TEMP|int}°C"
        _SET_CHAMBER_CONTROL TEMP={CHAMBER_TEMP} WAIT=True
        
        RESPOND MSG="✅ Chamber soak completed"
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=heat_soak_complete VALUE=1
    {% elif TIME_SOAK == True %}
        {% set SOAK_TIME_SECONDS = CHAMBER_TIME * 60 %}
        RESPOND MSG="Soaking for {CHAMBER_TIME} minutes"
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION={SOAK_TIME_SECONDS}
        SET_IDLE_TIMEOUT TIMEOUT={SOAK_IDLE_TIME}
        
    {% else %}
        RESPOND MSG="⚠️ No soak type configured!"
        
    {% endif %}
    
    # Stop bed fans and clear progress bar after successful soak
    _SET_LED_STATUS STATUS=STANDBY
    CLEAR_PROGRESS_BAR
    
    {% if HEAT_SOAK_COMPLETE == 1 %}
        _BEDFANSSLOW
    {% endif %}


[delayed_gcode _HEAT_SOAK_TIMER]
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set STARTING_PRINT = macrocfg.starting_print %}
    
    RESPOND MSG="✅ Soak completed"
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=heat_soak_complete VALUE=1
    _BEDFANSOFF
    
    # Clear progress bar when soak is complete
    _CLEAR_PROGRESS_BAR
    
    # Resume print start if this was part of print sequence
    {% if STARTING_PRINT|int == 1 %}
        RESUME_BASE
    {% endif %}


# ======================================================================================================== #
# =========================================== FAN PREPARATION ============================================ #
# ======================================================================================================== #

[gcode_macro _PREP_FANS]
description: Configure cooling fans for print operation
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONTROLLER_FAN = macrocfg.controller_fan %}
    {% set AIRFILTER = macrocfg.airfilter %}
    {% set AIRFILTER_SPEED = macrocfg.airfilter_speed %}
    {% set AIRFILTER_NAME = macrocfg.airfilter_name %}
    
    # Controller fan management
    {% if CONTROLLER_FAN == True %}
        _ELECTRONICSFANSFAST
    {% endif %}
    
    # Ensure part cooling fan is off initially
    M107
    
    # Air filter fan activation
    {% if AIRFILTER == True and AIRFILTER_SPEED > 0 %}
        SET_FAN_SPEED FAN={AIRFILTER_NAME} SPEED={AIRFILTER_SPEED}
    {% endif %}


# ======================================================================================================== #
# ========================================= SURFACE PREPARATION ========================================== #
# ======================================================================================================== #

[gcode_macro _PREP_SURFACE]
description: Complete surface preparation - homing, calibration, and meshing
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONFIG = printer.configfile.settings %}
    {% set DOCK_MACRO = macrocfg.dock_macro %}
    {% set CLEAN_PROBE = macrocfg.clean_probe %}
    {% set CLEAN_MACRO = macrocfg.clean_macro %}
    {% set AUTO_Z_CALIBRATE = macrocfg.auto_z_calibrate %}
    {% set Z_TILT = macrocfg.z_tilt %}
    {% set QGL = macrocfg.qgl %}
    {% set BED_MESH = macrocfg.bed_mesh %}
    {% set LOAD_MESH = macrocfg.load_mesh %}
    {% set MESH_PROFILE = macrocfg.mesh_profile %}
    {% set MESH_ADAPTIVE = macrocfg.mesh_adaptive %}
    
    # Clear progress bar and set calibration status
    CLEAR_PROGRESS_BAR
    
    # Homing and probe management
    RESPOND MSG="Homing"

    _SET_LED_STATUS STATUS=CALIBRATING
    
    {% if DOCKING_PROBE == True %}
        RESPOND MSG="Collecting probe"
        {% if printer.toolhead.homed_axes != "xyz" %}
            RESPOND MSG="Homing XY axes"
            CG28 Y X
        {% endif %}
        _ATTACH_PROBE
        RESPOND MSG="Homing Z axis"
        CG28 Z
    {% else %}
        CG28
    {% endif %}
    
    # Optional probe cleaning
    {% if CLEAN_PROBE == True %}
        _CLEAN_NOZZLE
    {% endif %}
    
    M400
    
    # Z-axis calibration procedures
    {% if AUTO_Z_CALIBRATE == True %}
        {% if CONFIG.z_calibration is defined %}
            RESPOND MSG="Calibrating Z offset"
            _SET_LED_STATUS STATUS=CALIBRATING
            CALIBRATE_Z
        {% else %}
            RESPOND MSG="❌ Z-Calibration not configured!"
        {% endif %}
    {% endif %}
    
    # Gantry leveling procedures
    {% if Z_TILT == True %}
        {% if CONFIG.z_tilt is defined %}
            RESPOND MSG="Adjusting Z-tilt"
            _SET_LED_STATUS STATUS=CALIBRATING
            Z_TILT_ADJUST
        {% else %}
            RESPOND MSG="❌ Z-Tilt not configured!"
        {% endif %}
    {% elif QGL == True %}
        {% if CONFIG.quad_gantry_level is defined %}
            _SET_LED_STATUS STATUS=CALIBRATING
            QUAD_GANTRY_LEVEL
        {% else %}
            RESPOND MSG="❌ QGL not configured!"
        {% endif %}
    {% endif %}

    M400
    
    # Bed mesh generation or loading
    {% if BED_MESH == True %}
        {% if CONFIG.bed_mesh is defined %}
            {% if LOAD_MESH == True %}
                BED_MESH_PROFILE LOAD={MESH_PROFILE}
                RESPOND MSG="Loaded mesh profile: {MESH_PROFILE}"
            {% else %}
                RESPOND MSG="Bed meshing"
                {% if MESH_ADAPTIVE == True %}
                    BED_MESH_CALIBRATE
                {% else %}
                    _BED_MESH_CALIBRATE
                {% endif %}
            {% endif %}
        {% else %}
            RESPOND MSG="❌ Bed mesh not configured!"
        {% endif %}
    {% endif %}
    
    # Dock probe after calibration procedures
    {% if DOCKING_PROBE == True %}
        _DOCK_PROBE
    {% endif %}

    RESPOND MSG="✅ Calibration completed"


# ======================================================================================================== #
# ======================================== EXTRUDER PREPARATION ========================================== #
# ======================================================================================================== #

[gcode_macro _PREP_EXTRUDER]
description: Heat nozzle and check filament, pausing if needed
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set AUTO_FILAMENT_DELAY = macrocfg.auto_filament_delay %}
    {% set EXTRUDER_TEMP = macrocfg.extruder_temp %}
    
    # Enable filament sensors if configured
    {% if AUTO_FILAMENT_SENSOR == True %}
        _ENABLE_FILAMENT_SENSOR
        G4 P{AUTO_FILAMENT_DELAY * 1000 }
    {% endif %}

    M400
    
    # Begin extruder heating
    _SET_LED_STATUS STATUS=HEATING
    
    RESPOND MSG="🔥 Heating nozzle: {EXTRUDER_TEMP|int}C"
    M104 S{EXTRUDER_TEMP}
    
    # Position for heating phase - use standard park position
    EXECUTE_PARKING TYPE=PARK
    
    # Wait for target temperature
    M109 S{EXTRUDER_TEMP}

    _SET_LED_STATUS STATUS=STANDBY
    
    # Check filament status and pause if needed
    _CHECK_FILAMENT_FOR_PRINT_START


# ======================================================================================================== #
# ===================================== FINAL START PRINT SEQUENCE ======================================= #
# ======================================================================================================== #

[gcode_macro _START_PRINT_2]
description: Second phase of print start - final preparation with new purge system
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CLEANING = macrocfg.cleaning %}
    {% set CLEAN_MACRO = macrocfg.clean_macro %}
    {% set PURGING = macrocfg.purging %}
    {% set PURGE_MID_RETRACT = macrocfg.purge_mid_retract %}
    {% set PREFILL_FACTOR = macrocfg.prefill_factor %}
    {% set PREFILL_AMOUNT = PREFILL_FACTOR * PURGE_MID_RETRACT %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_slow %}
    
    RESPOND MSG="Final print preparation"
    
    # Clear progress bar and set standby status
    CLEAR_PROGRESS_BAR
    _SET_LED_STATUS STATUS=STANDBY
    
    # Optional nozzle cleaning before purge
    {% if CLEANING == True %}
        _CLEAN_NOZZLE
    {% endif %}
    
    # Use unified purge system for print start
    {% if PURGE == True %}
        {% if ADAPTIVE_PURGE == True %}
            RESPOND MSG="Starting adaptive purge sequence"
            _ADAPTIVE_PURGE
        {% else %}
            RESPOND MSG="Starting print start purge sequence"
            _PURGE TYPE=standard
            RESPOND MSG="✅ Print start purge complete"
            
            # Set final coordinate modes and reset extruder
            G21                                                         # Set units to millimeters
            G91                                                         # Relative positioning
            G1 E{PREFILL_AMOUNT} F{EXTRUDE_SPEED}                       # Prefill nozzle
            G90                                                         # Absolute coordinates
            M82                                                         # Absolute extrusion
            G92 E0                                                      # Reset extruder position

        {% endif %}
    {% endif %}
    
    # Finalize print start process
    _MANAGE_PRINT_STATE STATE=END
    
    RESPOND MSG="Starting print"
    
    # Activate printing status with progress bar
    _SET_LED_STATUS STATUS=PRINTING_WITH_PROGRESS
