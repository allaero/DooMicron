# ======================================================================================================== #
# ======================================= MAIN END PRINT SEQUENCE ======================================== #
# ======================================================================================================== #

[gcode_macro _END_PRINT]
description: Execute complete print ending sequence
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set END_RETRACT = macrocfg.end_retract %}
    {% set END_RETRACT_LENGTH = macrocfg.end_retract_length %}
    {% set RETRACT_SPEED = macrocfg.filament_retract_fast %}
    {% set END_FILAMENT_CUT = macrocfg.end_filament_cut %}
    {% set END_UNLOAD = macrocfg.end_unload %}
    {% set FILAMENT_CUT_RETRACT = macrocfg.filament_cut_retract %}
    {% set POST_CUT_PUSH = macrocfg.post_cut_push %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_fast %}
    
    G91
    G1 Z{END_RAISE_DISTANCE} F{Z_LIFT_SPEED}                    # Immediately raises toolhead to prevent melting 
    G90
  
    # Final movement completion
    M400                                                    # Wait for all moves to finish
    
    # Filament handling based on configuration
    {% if END_UNLOAD == True %}
        FILAMENT_UNLOAD
          
    {% elif END_FILAMENT_CUT == True %}
        _FILAMENT_CUT
        
        # Track cut and retract operation
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE="'cut_retract'"
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE={FILAMENT_CUT_RETRACT}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE={POST_CUT_PUSH}
        
        G91
        G1 E{POST_CUT_PUSH} F{EXTRUDE_SPEED}
        G90
        
    {% elif END_RETRACT == True %}
        _TIP_SHAPING
        G91
        G1 E-{END_RETRACT_LENGTH} F{RETRACT_SPEED}
        G90
        
        # Track retract-only operation
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE="'retract_only'"
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE={END_RETRACT_LENGTH}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE=0.0
    {% endif %}
            
    
    # LED status indication for completion
    _SET_LED_STATUS STATUS=FINISHED
    
    # Optional nozzle cleaning
    {% if CLEAN_END == True %}
        _CLEAN_NOZZLE                                       # Execute nozzle cleaning
    {% endif %}
    
    # Park toolhead at configured position
    EXECUTE_PARKING TYPE=PARK                               # Execute parking sequence
    
    # Success notification and audio feedback
    RESPOND MSG="Print complete"
    {% if AUDIO_STATUS == True %}
        _PLAY_TUNE TYPE=MARIO        
    {% endif %}   

    # Begin component shutdown sequence
    _STOP_COMPONENTS


# ======================================================================================================== #
# ===================================== COMPONENT SHUTDOWN CONTROL ======================================= #
# ======================================================================================================== #

[gcode_macro _STOP_COMPONENTS]
description: Comprehensive component shutdown after print completion
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set USE_SCRUBBER = macrocfg.use_scrubber %}
    
    # Disable filament sensors if auto-management enabled
    {% if AUTO_FILAMENT_SENSOR == True %}
        _DISABLE_FILAMENT_SENSOR                                # Disable filament sensors
    {% endif %}
    
    # Air management system activation
    {% if USE_SCRUBBER == True %}
        _SCRUBBER                                               # Start VOC scrubbing cycle
    {% endif %}
    
    # Final hardware shutdown
    G90                                                         # Ensure absolute coordinates
    TURN_OFF_HEATERS                                            # Turn off all heaters
    M84                                                         # Disable stepper motors
