    _SET_LED_STATUS STATUS=STANDBY


# ======================================================================================================== #
# ======================================= CONDITIONAL CALIBRATION ======================================== #
# ======================================================================================================== #

[gcode_macro _CG28]
description: Conditional homing - only homes unhomed axes. Inputs: X, Y, Z (optional)
variable_output: 118
gcode:
    {% set X = True if "x" in rawparams|string|lower else False %}
    {% set Y = True if "y" in rawparams|string|lower else False %}
    {% set Z = True if "z" in rawparams|string|lower else False %}
    {% set ALL = True if rawparams|string|lower == "" else False %}
    
    {% if ALL %}
        {% set X, Y, Z = True, True, True %}
    {% endif %}

    # Check current homing status and determine what needs homing
    {% if printer.toolhead.homed_axes != "xyz" %}
        {% set HOME_X = True if "x" not in printer.toolhead.homed_axes else False %}
        {% set HOME_Y = True if "y" not in printer.toolhead.homed_axes else False %}
        {% set HOME_Z = True if "z" not in printer.toolhead.homed_axes else False %}
        
        # Execute homing based on requirements
        {% if HOME_X and HOME_Y and HOME_Z %}
            {% if ALL %}
                RESPOND MSG="Homing all axes"
                G28
            {% else %}
                {% if X and HOME_X %}
                    RESPOND MSG="Homing X-axis"
                    G28 X
                {% endif %}
                {% if Y and HOME_Y %}
                    RESPOND MSG="Homing Y-axis"
                    G28 Y
                {% endif %}
                {% if Z and HOME_Z %}
                    _SET_LED_STATUS STATUS=CALIBRATING
                    RESPOND MSG="Homing Z-axis"
                    G28 Z
                {% endif %}
            {% endif %}
        {% else %}
            {% if HOME_X and X %}
                RESPOND MSG="Homing X-axis"
                G28 X
            {% endif %}
            {% if HOME_Y and Y %}
                RESPOND MSG="Homing Y-axis"
                G28 Y
            {% endif %}
            {% if HOME_Z and Z %}
                _SET_LED_STATUS STATUS=CALIBRATING
                RESPOND MSG="Homing Z-axis"
                G28 Z
            {% endif %}
        {% endif %}
        _SET_LED_STATUS STATUS=STANDBY
    {% endif %}


[gcode_macro _CQGL]
description: Conditional quad gantry leveling - only runs if not already applied
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        _SET_LED_STATUS STATUS=CALIBRATING
     
        _CG28
        QUAD_GANTRY_LEVEL
        
        _SET_LED_STATUS STATUS=STANDBY
    {% endif %}


# ======================================================================================================== #
# ========================================= QUAD GANTRY LEVELING ========================================= #
# ======================================================================================================== #

[gcode_macro QUAD_GANTRY_LEVEL]
description: Execute QGL with auto-centering and Z re-home
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set X_CENTER = printer.toolhead.axis_maximum.x|float / 2.0 %}
    {% set Y_CENTER = printer.toolhead.axis_maximum.y|float / 2.0 %}
    {% set TRAVEL_SPEED = macrocfg.travel_fast %}

    _CG28
    RESPOND MSG="QGL"
    
    _SET_LED_STATUS STATUS=CALIBRATING
                                                                                               
    _QUAD_GANTRY_LEVEL
    
    G90
    G28 Z
    
    _SET_LED_STATUS STATUS=STANDBY


# ======================================================================================================== #
# ========================================== ADAPTIVE BED MESH =========================================== #
# ======================================================================================================== #

[gcode_macro BED_MESH_CALIBRATE]
description: Adaptive bed mesh based on print objects. Cartographer uses standard mesh, probe uses adaptive boundaries
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONFIG = printer.configfile.settings %}
    {% set DOCKING_PROBE = macrocfg.docking_probe %}
    {% set USING_CARTOGRAPHER = CONFIG.scanner is defined %}
    {% set ALL_POINTS = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set BED_MESH_MIN = CONFIG.bed_mesh.mesh_min %}
    {% set BED_MESH_MAX = CONFIG.bed_mesh.mesh_max %}
    {% set MAX_PROBE_POINT_DISTANCE_X = (BED_MESH_MAX[0] - BED_MESH_MIN[0]) / (CONFIG.bed_mesh.probe_count[0]-2) %}
    {% set MAX_PROBE_POINT_DISTANCE_Y = (BED_MESH_MAX[1] - BED_MESH_MIN[1]) / (CONFIG.bed_mesh.probe_count[1]-2) %}
    {% set X_MIN = BED_MESH_MIN[0] %}
    {% set Y_MIN = BED_MESH_MIN[1] %}
    {% set X_MAX = BED_MESH_MAX[0] %}
    {% set Y_MAX = BED_MESH_MAX[1] %}
    {% set MESH_FUZZ_ENABLED = macrocfg.mesh_fuzz_enabled %}
    {% set MESH_FUZZ_MIN = macrocfg.mesh_fuzz_min %}
    {% set MESH_FUZZ_MAX = macrocfg.mesh_fuzz_max %}
    
    # Check if using Cartographer
    {% set USING_CARTOGRAPHER = CONFIG.scanner is defined %}

    _CQGL
    
    {% if USING_CARTOGRAPHER %}
        # Cartographer - use standard mesh, scanner handles it
        {% if DOCKING_PROBE == True %}
            _ATTACH_PROBE
        {% endif %}
        _SET_LED_STATUS STATUS=CALIBRATING
        
        RESPOND MSG="Cartographer bed mesh"
        _BED_MESH_CALIBRATE
        
        {% if DOCKING_PROBE == True %}
            _DOCK_PROBE
        {% endif %}
        _SET_LED_STATUS STATUS=STANDBY
        
    {% else %}
        # Only apply adaptive mesh if there are print objects
        {% if ALL_POINTS %}
            # Apply mesh fuzzing or precise boundaries based on configuration
            {% if MESH_FUZZ_ENABLED == True %}
                {% set FUZZ_RANGE = range(MESH_FUZZ_MIN * 100 | int, MESH_FUZZ_MAX * 100 | int) %}
                {% set X_MIN = (BED_MESH_MIN[0], ((ALL_POINTS | map(attribute=0) | min - (FUZZ_RANGE | random / 100.0)) | default(BED_MESH_MIN[0]))) | max %}
                {% set Y_MIN = (BED_MESH_MIN[1], ((ALL_POINTS | map(attribute=1) | min - (FUZZ_RANGE | random / 100.0)) | default(BED_MESH_MIN[1]))) | max %}
                {% set X_MAX = (BED_MESH_MAX[0], ((ALL_POINTS | map(attribute=0) | max + (FUZZ_RANGE | random / 100.0)) | default(BED_MESH_MAX[0]))) | min %}
                {% set Y_MAX = (BED_MESH_MAX[1], ((ALL_POINTS | map(attribute=1) | max + (FUZZ_RANGE | random / 100.0)) | default(BED_MESH_MAX[1]))) | min %}
            {% else %}
                {% set X_MIN = [BED_MESH_MIN[0], (ALL_POINTS | map(attribute=0) | min | default(BED_MESH_MIN[0]))] | max %}
                {% set Y_MIN = [BED_MESH_MIN[1], (ALL_POINTS | map(attribute=1) | min | default(BED_MESH_MIN[1]))] | max %}
                {% set X_MAX = [BED_MESH_MAX[0], (ALL_POINTS | map(attribute=0) | max | default(BED_MESH_MAX[0]))] | min %}
                {% set Y_MAX = [BED_MESH_MAX[1], (ALL_POINTS | map(attribute=1) | max | default(BED_MESH_MAX[1]))] | min %}
            {% endif %}
            
            RESPOND MSG="Adaptive bed mesh for print area"
        {% else %}
            RESPOND MSG="No print objects detected - using full bed mesh"
        {% endif %}
        
        # Calculate probe points and algorithm selection
        {% set POINTS_X = (((X_MAX - X_MIN) / MAX_PROBE_POINT_DISTANCE_X) | int) + 2 %}
        {% set POINTS_Y = (((Y_MAX - Y_MIN) / MAX_PROBE_POINT_DISTANCE_Y) | int) + 2 %}
        {% set ALGORITHM = "bicubic" if ([POINTS_X, POINTS_Y]|max) > 6 else "lagrange" %}
        {% set MIN_POINTS = 4 if ALGORITHM == "bicubic" else 3 %}
        {% set POINTS_X = [POINTS_X, MIN_POINTS]|max %}
        {% set POINTS_Y = [POINTS_Y, MIN_POINTS]|max %}
        
        # Reference index calculation for relative reference
        {% set REF_INDEX = (POINTS_X * POINTS_Y / 2) | int if CONFIG.bed_mesh.relative_reference_index is defined else -1 %}
        
        # Probe attachment and LED status
        {% if DOCKING_PROBE == True %}
            _ATTACH_PROBE
        {% endif %}
        _SET_LED_STATUS STATUS=CALIBRATING
        
        # Execute adaptive mesh calibration
        {% if REF_INDEX >= 0 %}
            _BED_MESH_CALIBRATE MESH_MIN={X_MIN},{Y_MIN} MESH_MAX={X_MAX},{Y_MAX} ALGORITHM={ALGORITHM} PROBE_COUNT={POINTS_X},{POINTS_Y} RELATIVE_REFERENCE_INDEX={REF_INDEX}
        {% else %}
            _BED_MESH_CALIBRATE MESH_MIN={X_MIN},{Y_MIN} MESH_MAX={X_MAX},{Y_MAX} ALGORITHM={ALGORITHM} PROBE_COUNT={POINTS_X},{POINTS_Y}
        {% endif %}

        G90
        G28 Z
        
        # Cleanup and status return
        {% if DOCKING_PROBE == True %}
            _DOCK_PROBE
        {% endif %}
        _SET_LED_STATUS STATUS=STANDBY
    {% endif %}


# ======================================================================================================== #
# ========================================= SPEED AND ACCEL TEST ========================================= #
# ======================================================================================================== #

[gcode_macro _TEST_SPEED]
description: Speed and acceleration testing with large/small patterns. Inputs: SPEED (mm/s), ACCEL (mm/s²), ITERATIONS (count), BOUND (mm), SMALLPATTERNSIZE (mm)
gcode:
    # Parameter collection with defaults from config
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set SPEED = params.speed|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set ITERATIONS = params.iterations|default(5)|int %}
    {% set ACCEL = params.accel|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set MIN_CRUISE_RATIO = params.min_cruise_ratio|default(0.5)|float %}
    {% set BOUND = params.BOUND|default(20)|int %}
    {% set SMALLPATTERNSIZE = params.smallpatternsize|default(20)|int %}
    {% set X_MIN = printer.toolhead.axis_minimum.x + BOUND %}
    {% set X_MAX = printer.toolhead.axis_maximum.x - BOUND %}
    {% set Y_MIN = printer.toolhead.axis_minimum.y + BOUND %}
    {% set Y_MAX = printer.toolhead.axis_maximum.y - BOUND %}
    {% set X_CENTER = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set Y_CENTER = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}
    {% set X_CENTER_MIN = X_CENTER - (SMALLPATTERNSIZE/2) %}
    {% set X_CENTER_MAX = X_CENTER + (SMALLPATTERNSIZE/2) %}
    {% set Y_CENTER_MIN = Y_CENTER - (SMALLPATTERNSIZE/2) %}
    {% set Y_CENTER_MAX = Y_CENTER + (SMALLPATTERNSIZE/2) %}
    {% set SAFE_MOVE_SPEED = macrocfg.safe_speed %}
    {% set TEST_SPEED_PAUSE_TIME = 1000 %}
    
    # Save current state and initialize
    SAVE_GCODE_STATE NAME=TEST_SPEED
    RESPOND MSG="Starting {ITERATIONS} iterations at {SPEED}mm/s, {ACCEL}mm/s²"
    
    # Home and establish baseline position
    M400
    _CG28
    
    # QGL if configured and not applied
    {% if printer.configfile.settings.quad_gantry_level %}
        {% if printer.quad_gantry_level.applied == False %}
            _CQGL
        {% endif %}
    {% endif %}
    
    # Pre-test positioning and status
    _SET_LED_STATUS STATUS=CALIBRATING
    
    G90
    G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{SAFE_MOVE_SPEED * 60}
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{SAFE_MOVE_SPEED * 60}
    G4 P{TEST_SPEED_PAUSE_TIME}
    GET_POSITION
    
    # Move to test starting position
    G0 X{X_MIN} Y{Y_MIN} Z{BOUND + 10} F{SPEED * 60}
    
    # Apply test velocity limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL} MINIMUM_CRUISE_RATIO={MIN_CRUISE_RATIO}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL} ACCEL_TO_DECEL={ACCEL / 2}
    {% endif %}
    
    # Execute test pattern iterations
    {% for i in range(ITERATIONS) %}
        # Large pattern diagonals
        G0 X{X_MIN} Y{Y_MIN} F{SPEED * 60}
        G0 X{X_MAX} Y{Y_MAX} F{SPEED * 60}
        G0 X{X_MIN} Y{Y_MIN} F{SPEED * 60}
        G0 X{X_MAX} Y{Y_MIN} F{SPEED * 60}
        G0 X{X_MIN} Y{Y_MAX} F{SPEED * 60}
        G0 X{X_MAX} Y{Y_MIN} F{SPEED * 60}
    
        # Large pattern perimeter
        G0 X{X_MIN} Y{Y_MIN} F{SPEED * 60}
        G0 X{X_MIN} Y{Y_MAX} F{SPEED * 60}
        G0 X{X_MAX} Y{Y_MAX} F{SPEED * 60}
        G0 X{X_MAX} Y{Y_MIN} F{SPEED * 60}
    
        # Small pattern diagonals
        G0 X{X_CENTER_MIN} Y{Y_CENTER_MIN} F{SPEED * 60}
        G0 X{X_CENTER_MAX} Y{Y_CENTER_MAX} F{SPEED * 60}
        G0 X{X_CENTER_MIN} Y{Y_CENTER_MIN} F{SPEED * 60}
        G0 X{X_CENTER_MAX} Y{Y_CENTER_MIN} F{SPEED * 60}
        G0 X{X_CENTER_MIN} Y{Y_CENTER_MAX} F{SPEED * 60}
        G0 X{X_CENTER_MAX} Y{Y_CENTER_MIN} F{SPEED * 60}
    
        # Small pattern perimeter
        G0 X{X_CENTER_MIN} Y{Y_CENTER_MIN} F{SPEED * 60}
        G0 X{X_CENTER_MIN} Y{Y_CENTER_MAX} F{SPEED * 60}
        G0 X{X_CENTER_MAX} Y{Y_CENTER_MAX} F{SPEED * 60}
        G0 X{X_CENTER_MAX} Y{Y_CENTER_MIN} F{SPEED * 60}
    {% endfor %}
    
    # Restore original velocity limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}
    
    # Post-test verification and cleanup
    M400
    G28                                                         # Full home to address any CoreXZ issues
    
    _SET_LED_STATUS STATUS=CALIBRATING
    
    # Final position verification
    G90
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{SAFE_MOVE_SPEED * 60}
    G4 P{TEST_SPEED_PAUSE_TIME}
    GET_POSITION
    
    # Restore state and complete
    RESTORE_GCODE_STATE NAME=TEST_SPEED
    
    _SET_LED_STATUS STATUS=STANDBY
    
    RESPOND MSG="✅ Speed test completed"

    
# ======================================================================================================== #
# ========================================= PID TUNING MACROS ============================================ #
# ======================================================================================================== #

[gcode_macro _PID_EXTRUDER]
description: PID tune extruder with fan control. Inputs: TEMPERATURE (°C), FAN_IN_PERCENT (0-100)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set E = printer.toolhead.extruder %}
    {% set T = params.temperature|default(macrocfg.extruder_temp)|float %}
    {% set S = params.fan_in_percent|default(0)|float * macrocfg.pid_fan_speed_multiplier %}
    {% set P = printer.configfile.config[E].pid_kp|float %}
    {% set I = printer.configfile.config[E].pid_ki|float %}
    {% set D = printer.configfile.config[E].pid_kd|float %}
    
    M106 S{S}
    RESPOND MSG="Current PID: Kp={P} Ki={I} Kd={D}"
    PID_CALIBRATE HEATER={E} TARGET={T}
    TURN_OFF_HEATERS
    SAVE_CONFIG


[gcode_macro _PID_BED]
description: PID tune bed heater. Inputs: TEMPERATURE (°C)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set T = params.TEMPERATURE|default(macrocfg.bed_temp)|float %}
    {% set P = printer.configfile.config['heater_bed'].pid_kp|float %}
    {% set I = printer.configfile.config['heater_bed'].pid_ki|float %}
    {% set D = printer.configfile.config['heater_bed'].pid_kd|float %}
    
    RESPOND MSG="Current bed PID: Kp={P} Ki={I} Kd={D}"
    PID_CALIBRATE HEATER=heater_bed TARGET={T}
    TURN_OFF_HEATERS
    SAVE_CONFIG
