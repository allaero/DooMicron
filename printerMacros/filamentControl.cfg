# ======================================================================================================== #
# ============================================ FILAMENT CHANGE =========================================== #
# ======================================================================================================== #

[gcode_macro COLOR_CHANGE]
description: Initiate color change procedure with automated handling
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set IDLE_TIME = macrocfg.idle_time %}
    {% set AUDIO_STATUS = macrocfg.audio_status %}
    
    RESPOND MSG="Changing colors"
    
    # Save current temperature for restoration
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=filament_m600_prev_temp VALUE={printer.extruder.target}
    SET_IDLE_TIMEOUT TIMEOUT={IDLE_TIME}           # Extend timeout
    
    {% if AUDIO_STATUS == True %}
	_PLAY_TUNE TYPE=CHANGE
    {% endif %}
    
    M600                                                        # Execute M600
    M400                                                        # Wait for completion

    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=parking_phase VALUE="'FULL'"


[gcode_macro M600]
description: Filament change procedure - parks, unloads if configured, waits for reload
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUTO_UNLOAD = macrocfg.auto_unload %}
    {% set USE_FLUIDD = macrocfg.use_fluidd %}
    {% set FILAMENT_M600_COLDSTART = macrocfg.filament_m600_coldstart %}
    {% set RUNOUT = macrocfg.runout %}
    {% set AUDIO_STATUS = macrocfg.audio_status %}

    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=in_m600_context VALUE=True
    
    _SET_LED_STATUS STATUS=M600
    
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=parking_phase VALUE="'Z_RAISE'"
    EXECUTE_PARKING TYPE=COLOR_CHANGE
    
    # Handle different M600 scenarios
    {% if FILAMENT_M600_COLDSTART == 0 and RUNOUT == 0 %}
        {% if AUTO_UNLOAD == True %}
            FILAMENT_UNLOAD
        {% else %}
            M109 S0
            {% if USE_FLUIDD == True %}
                {% if FILAMENT_M600_COLDSTART == 0 %}
                    RESPOND MSG="⚠️ Run FILAMENT_UNLOAD to unload"
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    
    # Reset runout flag
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=runout VALUE=0
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=in_m600_context VALUE=False


# ======================================================================================================== #
# ========================================== FILAMENT UNLOADING ========================================== #
# ======================================================================================================== #

[gcode_macro FILAMENT_UNLOAD]
description: Unload filament with heating and tip shaping. Inputs: LENGTH (mm), TARGET (°C)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONFIG = printer.configfile.settings %}
    {% set LENGTH = params.LENGTH|default(macrocfg.filament_m600_unload_length)|float %}
    {% set TARGET = params.TARGET|default(macrocfg.min_extrude_temp)|float %}
    {% set AUDIO_STATUS = macrocfg.audio_status %}
    {% set FILAMENT_M600_PREV_TEMP = macrocfg.filament_m600_prev_temp %}
    {% set TEMP_TOLERANCE = macrocfg.temp_tolerance %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set USE_FLUIDD = macrocfg.use_fluidd %}
    {% set AUTO_LOAD = macrocfg.auto_load %}
    {% set CUR_TEMP = printer.extruder.temperature|float %}
    {% set CUR_TARG = printer.extruder.target|int %}
    {% set MIN_EXTRUDE = CONFIG.extruder.min_extrude_temp|int if CONFIG.extruder.extruder_temp_min is defined else extruder_temp_min %}
    
    {% if FILAMENT_M600_PREV_TEMP != 0 %}
        {% set TARGET = FILAMENT_M600_PREV_TEMP %}
    {% elif params.TARGET is defined and params.TARGET|int > MIN_EXTRUDE %}
        {% set TARGET = params.TARGET|int|default(macrocfg.min_extrude_temp) %}
    {% endif %}

    _CG28                                                       # Home if needed
    
    RESPOND MSG="Unloading filament"
    
    {% if AUTO_FILAMENT_SENSOR == True %}
        _DISABLE_FILAMENT_SENSOR                                # Disable sensors during unload
    {% endif %}
    
    _EXTRACT_FILAMENT                                           # Execute extraction sequence
   
    {% if USE_FLUIDD == True and AUTO_LOAD == False %}
        RESPOND MSG="⚠️ Run FILAMENT_LOAD to load new filament"
    {% endif %}
    M400
    RESPOND MSG="✅ Filament unloading complete"


# ======================================================================================================== #
# ========================================== FILAMENT EXTRACTION ========================================= #
# ======================================================================================================== #

[gcode_macro _EXTRACT_FILAMENT]
description: Extract filament with tip shaping and optional cutting. Tracks operation state for smart priming
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set UNLOAD_SPEED = macrocfg.filament_extrude_fast %}
    {% set ENABLE_FILAMENT_CUT = macrocfg.enable_filament_cut %}
    {% set POST_CUT_PUSH = macrocfg.post_cut_push %}
    {% set FILAMENT_M600_UNLOAD_LENGTH = macrocfg.filament_m600_unload_length %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_fast %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set FILAMENT_CUT_RETRACT = macrocfg.filament_cut_retract %}
    
    # Execute tip shaping
    _TIP_SHAPING

    # Optional filament cutting
    {% if ENABLE_FILAMENT_CUT == True %}
        _FILAMENT_CUT                                           # Execute cutting sequence
        
        # Track the cut and push operation
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE='"cut_retract"'
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE={FILAMENT_CUT_RETRACT}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE={POST_CUT_PUSH}
        
        SAVE_VARIABLE VARIABLE=last_filament_operation VALUE='"cut_retract"'
        SAVE_VARIABLE VARIABLE=last_retract_amount VALUE={FILAMENT_CUT_RETRACT}
        SAVE_VARIABLE VARIABLE=last_push_amount VALUE={POST_CUT_PUSH}
        
        G91                                                     # Relative positioning
        G1 E{POST_CUT_PUSH} F{EXTRUDE_SPEED}                    # Return to hotend slowly
        G90                                                     # Absolute positioning
        
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=parking_phase VALUE="'XY_MOVE'"
        EXECUTE_PARKING TYPE=COLOR_CHANGE
        
        {% if AUTO_FILAMENT_SENSOR == True %}
            _ENABLE_FILAMENT_SENSOR
        {% endif %}

        # Main unload retraction
        G91                                                         # Relative positioning
        G1 E-{FILAMENT_M600_UNLOAD_LENGTH} F{UNLOAD_SPEED}          # Main unload retraction
        G90                                                         # Absolute positioning

    {% else %}
    
        # Main unload retraction
        G91                                                         # Relative positioning
        G1 E-{FILAMENT_M600_UNLOAD_LENGTH} F{UNLOAD_SPEED}          # Main unload retraction
        G90                                                         # Absolute positioning
        
        # Track full unload operation
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE='"full_unload"'
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE={FILAMENT_M600_UNLOAD_LENGTH}
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE=0.0
        
        SAVE_VARIABLE VARIABLE=last_filament_operation VALUE='"full_unload"'
        SAVE_VARIABLE VARIABLE=last_retract_amount VALUE={FILAMENT_M600_UNLOAD_LENGTH}
        SAVE_VARIABLE VARIABLE=last_push_amount VALUE=0.0

    {% endif %}
    
    M400                                                        # Wait for completion


# ======================================================================================================== #
# ============================================== TIP SHAPING ============================================= #
# ======================================================================================================== #

[gcode_macro _TIP_SHAPING]
description: Tip shaping sequence for clean filament separation
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set TIP_SHAPING_ENABLED = macrocfg.tip_shaping_enabled %}
    {% set RETRACT_SPEED = macrocfg.filament_retract_fast %}
    {% set MIN_TEMP = macrocfg.min_extrude_temp %}
    {% set TIP_TUNE_1 = macrocfg.tip_tune_1 %}
    {% set TIP_TUNE_2 = macrocfg.tip_tune_2 %}
    {% set TIP_TUNE_3 = macrocfg.tip_tune_3 %}
    
    {% if TIP_SHAPING_ENABLED == True %}
        # Verify temperature before shaping
        _VERIFY_EXTRUDE_TEMP
        
        RESPOND MSG="Executing tip shaping"
        G91                                                     # Relative positioning
        G1 E-{TIP_TUNE_1} F{RETRACT_SPEED}                      # Quick retraction
        G1 E{TIP_TUNE_1} F{RETRACT_SPEED}                       # Quick extrusion
        G1 E-{TIP_TUNE_2} F{RETRACT_SPEED}                      # Controlled retraction
        G1 E{TIP_TUNE_2} F{RETRACT_SPEED}                       # Skinny dip extrusion
        G1 E-{TIP_TUNE_3} F{RETRACT_SPEED}                      # Pull to cold end
        G90                                                     # Absolute positioning

        M400
        RESPOND MSG="✅ Tip shaping complete"
    {% endif %}


# ======================================================================================================== #
# =========================================== FILAMENT CUTTING =========================================== #
# ======================================================================================================== #

[gcode_macro _FILAMENT_CUT]
description: Cut filament using gantry depressor
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set SAFE_Z = macrocfg.filament_cut_safe_z %}
    {% set SAFE_X = macrocfg.filament_cut_safe_x %}
    {% set SAFE_Y = macrocfg.filament_cut_safe_y %}
    {% set INIT_X = macrocfg.filament_cut_init_x %}
    {% set INIT_Y = macrocfg.filament_cut_init_y %}
    {% set CUT_Y = macrocfg.filament_cut_y %}
    {% set CUT_RETRACT = macrocfg.filament_cut_retract %}
    {% set CUT_SPEED = macrocfg.filament_cut_speed %}
    {% set APPROACH_SPEED = macrocfg.travel_slow %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_slow %}

    _CG28
    G91                                                         # Relative positioning
    G1 Z{SAFE_Z} F{CUT_SPEED}                                   # Safe Z clearance
    G90                                                         # Absolute positioning
    G1 X{SAFE_X} Y{SAFE_Y} F{APPROACH_SPEED}                    # Move to start position
    G1 X{INIT_X} Y{INIT_Y} F{APPROACH_SPEED}                    # Position for cut
    G1 Y{CUT_Y} F{CUT_SPEED}                                    # Execute cutting motion
    G91                                                         # Relative for retraction
    G1 E-{CUT_RETRACT} F{EXTRUDE_SPEED}                         # Retract cut filament
    G90                                                         # Back to absolute
    G1 Y{INIT_Y} F{APPROACH_SPEED}                              # Clear cut area
    G1 X{SAFE_X} Y{SAFE_Y} F{APPROACH_SPEED}                    # Return to safe position


# ======================================================================================================== #
# ======================================== FILAMENT INSERTION HANDLER ==================================== #
# ======================================================================================================== #

[gcode_macro _FILAMENT_INSERT_HANDLER]
description: Handle filament insertion detection and route to appropriate loading sequence
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set STARTING_PRINT = macrocfg.starting_print %}
    {% set AUTO_LOAD = macrocfg.auto_load %}
    
    RESPOND MSG="Filament insertion detected"
    
    # Check context and route appropriately
    {% if STARTING_PRINT == 1 %}
        # Print start context - let print start sequence handle it
        RESPOND MSG="Print start in progress - automatic handling active"
        FILAMENT_LOAD
    {% elif AUTO_LOAD == True %}
        # Normal auto-load for color changes
        RESPOND MSG="Auto-loading filament"
        FILAMENT_LOAD
    {% else %}
        # Manual load required
        RESPOND MSG="⚠️ Run FILAMENT_LOAD to complete loading"
    {% endif %}


# ======================================================================================================== #
# ========================================== PRINT START CHECK =========================================== #
# ======================================================================================================== #

[gcode_macro _CHECK_FILAMENT_FOR_PRINT_START]
description: Check filament presence and apply smart prime based on previous operation state
variable_waiting_for_filament: False
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set IDLE_TIME = macrocfg.idle_time %}
    {% set UPPER_FILAMENT_SENSOR = macrocfg.upper_filament_sensor %}
    {% set LOWER_FILAMENT_SENSOR = macrocfg.lower_filament_sensor %}
    {% set FILAMENT_EXTRUDE_FAST = macrocfg.filament_extrude_fast %}
    {% set LAST_OPERATION = macrocfg.last_filament_operation %}
    {% set LAST_RETRACT = macrocfg.last_retract_amount %}
    {% set LAST_PUSH = macrocfg.last_push_amount %}
    {% set UPPER_DETECTED = printer["filament_switch_sensor " + UPPER_FILAMENT_SENSOR].filament_detected %}
    {% set LOWER_DETECTED = printer["filament_switch_sensor " + LOWER_FILAMENT_SENSOR].filament_detected %}

    RESPOND MSG="Checking filament sensors..."
    RESPOND MSG="Upper sensor: {UPPER_DETECTED}, Lower sensor: {LOWER_DETECTED}"
    
    # Streamlined sensor validation logic
    {% if UPPER_DETECTED and LOWER_DETECTED %}
        # Both sensors detect - filament is properly loaded
        RESPOND MSG="✅ Sensors detected - filament loaded"
        
        # Calculate smart prime amount based on last operation
        {% set PRIME_AMOUNT = 0.0 %}
        
        {% if LAST_OPERATION == 'cut_retract' %}
            # Cut + retract - calculate net retraction and prime it back
            {% set NET_RETRACT = LAST_RETRACT - LAST_PUSH %}
            {% set PRIME_AMOUNT = NET_RETRACT %}
            RESPOND MSG="Previous: cut+retract ({LAST_RETRACT|round(1)}mm - {LAST_PUSH|round(1)}mm = {NET_RETRACT|round(1)}mm net)"
            
        {% elif LAST_OPERATION == 'retract_only' %}
            # Retract only (no cut) - prime full retraction
            {% set PRIME_AMOUNT = LAST_RETRACT %}
            RESPOND MSG="Previous: retract only ({PRIME_AMOUNT|round(1)}mm)"
            
        {% elif LAST_OPERATION == 'full_unload' %}
            # Full unload - no prime needed, filament was just loaded
            RESPOND MSG="Previous: full unload - no prime needed (just loaded fresh)"
            
        {% elif LAST_OPERATION == 'none' %}
            # Fresh filament load - no prime needed
            RESPOND MSG="Previous: fresh load - no prime needed"
        {% endif %}
        
        # Apply prime if needed
        {% if PRIME_AMOUNT > 0 %}
            RESPOND MSG="Applying smart prime: {PRIME_AMOUNT|round(1)}mm"
            G91
            G1 E{PRIME_AMOUNT} F{FILAMENT_EXTRUDE_FAST}
            G90
        {% endif %}
        
        # Clear the operation state since we've handled it
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE='"none"'
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE=0.0
        
        SAVE_VARIABLE VARIABLE=last_filament_operation VALUE='"none"'
        SAVE_VARIABLE VARIABLE=last_retract_amount VALUE=0.0
        SAVE_VARIABLE VARIABLE=last_push_amount VALUE=0.0
        
    {% else %}
        # Any other combination - pause and load filament
        RESPOND MSG="❌ Sensors NOT detected - insert filament..."
        SET_GCODE_VARIABLE MACRO=_CHECK_FILAMENT_FOR_PRINT_START VARIABLE=waiting_for_filament VALUE=True
        
        # SET EXTENDED IDLE TIMEOUT TO PREVENT AUTO-RESUME
        SET_IDLE_TIMEOUT TIMEOUT={IDLE_TIME}        
        _SET_LED_STATUS STATUS=ERROR
        
        PAUSE_BASE
        FILAMENT_LOAD
    {% endif %}


# ======================================================================================================== #
# =========================================== FILAMENT LOADING =========================================== #
# ======================================================================================================== #

[gcode_macro FILAMENT_LOAD]
description: Unified filament loading with context-aware purge selection
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}

    # Detect current print state
    _GET_PRINT_STATE
    
    # Route to appropriate loading sequence based on context
    {% if macrocfg.starting_print == 1 %}
        # Print start context - use dedicated print start loading
        _LOAD_FILAMENT_PRINT_START
    {% else %}
        # Color change or manual loading context
        _LOAD_FILAMENT_COLOR_CHANGE
    {% endif %}


# ======================================================================================================== #
# ========================================== PRINT START LOADING ========================================= #
# ======================================================================================================== #

[gcode_macro _LOAD_FILAMENT_PRINT_START]
description: Print start filament loading sequence
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set AUTO_FILAMENT_DELAY = macrocfg.auto_filament_delay * 1000 %}
    {% set LOWER_FILAMENT_SENSOR = macrocfg.lower_filament_sensor %}
    {% set UPPER_FILAMENT_SENSOR = macrocfg.upper_filament_sensor %}
    
    # CRITICAL: Ensure sensors are enabled for loading operations
    {% if AUTO_FILAMENT_SENSOR == True %}
        RESPOND MSG="🔌 Ensuring filament sensors are enabled"
        _ENABLE_FILAMENT_SENSOR
        G4 P{AUTO_FILAMENT_DELAY}                                # Wait for sensors to activate
    {% endif %}
    
    # Check current sensor states and route accordingly
    _DETECT_FILAMENT_SENSORS

    {% if LOWER_DETECTED %}
        RESPOND MSG="✅ Filament already loaded"
        _FINALIZE_PRINT_START_LOAD DID_LOADING=0                 # No loading needed
    {% elif UPPER_DETECTED %}
        RESPOND MSG="Loading filament to hotend"
        _EXTRUDE_TO_HOTEND CONTEXT=PRINT_START
    {% else %}
        RESPOND MSG="⚠️ Insert filament - waiting for detection"
        _WAIT_FOR_INSERTION CONTEXT=PRINT_START
    {% endif %}


# ======================================================================================================== #
# ========================================= COLOR CHANGE LOADING ========================================= #
# ======================================================================================================== #

[gcode_macro _LOAD_FILAMENT_COLOR_CHANGE]
description: Color change filament loading sequence
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set AUTO_FILAMENT_DELAY = macrocfg.auto_filament_delay * 1000 %}
    {% set LOWER_FILAMENT_SENSOR = macrocfg.lower_filament_sensor %}
    {% set UPPER_FILAMENT_SENSOR = macrocfg.upper_filament_sensor %}
    
    # Ensure sensors are enabled for loading operations
    {% if AUTO_FILAMENT_SENSOR == True %}
        _ENABLE_FILAMENT_SENSOR
        G4 P{AUTO_FILAMENT_DELAY}                                # Wait for sensors to activate
    {% endif %}
    
    # Check current sensor states and route accordingly
    _DETECT_FILAMENT_SENSORS

    {% if LOWER_DETECTED %}
        RESPOND MSG="✅ Filament already loaded"
        _FINALIZE_COLOR_CHANGE_LOAD
    {% elif UPPER_DETECTED %}
        RESPOND MSG="Loading filament to hotend"
        _EXTRUDE_TO_HOTEND CONTEXT=COLOR_CHANGE
    {% else %}
        RESPOND MSG="⚠️ Insert filament - waiting for detection"
        _WAIT_FOR_INSERTION CONTEXT=COLOR_CHANGE
    {% endif %}


# ======================================================================================================== #
# ======================================== FILAMENT INSERTION WAITING ==================================== #
# ======================================================================================================== #

[gcode_macro _WAIT_FOR_INSERTION]
description: Wait for filament insertion with periodic checks. Inputs: CONTEXT (PRINT_START or COLOR_CHANGE)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONTEXT = params.CONTEXT|default("unknown") %}
    {% set GRAB_DISTANCE = macrocfg.filament_grab_distance %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_fast %}
    {% set UPPER_FILAMENT_SENSOR = macrocfg.upper_filament_sensor %}
    {% set FILAMENT_INSERTION_CHECK_DELAY = macrocfg.filament_insertion_check_delay %}
    {% set UPPER_DETECTED = printer["filament_switch_sensor " + UPPER_FILAMENT_SENSOR].filament_detected %}

    # Attempt to grab any inserted filament
    G91   
    G1 E{GRAB_DISTANCE} F{EXTRUDE_SPEED}
    G90
    
    {% if UPPER_DETECTED %}
        RESPOND MSG="Filament detected, loading..."
        _SET_LED_STATUS STATUS=STANDBY
        _EXTRUDE_TO_HOTEND CONTEXT={CONTEXT}
    {% else %}
        # Continue waiting with unified delayed gcode
        UPDATE_DELAYED_GCODE ID=CONTINUE_WAITING DURATION={FILAMENT_INSERTION_CHECK_DELAY}
    {% endif %}


[delayed_gcode CONTINUE_WAITING]
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set STARTING_PRINT = macrocfg.starting_print %}
    
    # Determine context from current state
    {% if STARTING_PRINT == 1 %}
        _WAIT_FOR_INSERTION CONTEXT=PRINT_START
    {% else %}
        _WAIT_FOR_INSERTION CONTEXT=COLOR_CHANGE
    {% endif %}


# ======================================================================================================== #
# ======================================= FILAMENT EXTRUSION SYSTEM ====================================== #
# ======================================================================================================== #

[gcode_macro _EXTRUDE_TO_HOTEND]
description: Incremental extrusion to hotend with dual sensor validation. Inputs: CONTEXT (PRINT_START or COLOR_CHANGE)
variable_extrusion_count: 0
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set CONTEXT = params.CONTEXT|default("unknown") %}
    {% set EXTRUSION_INCREMENT = macrocfg.filament_load_increment %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_fast %}
    {% set MAX_EXTRUSIONS = macrocfg.filament_max_extrusion_distance %}
    {% set UPPER_FILAMENT_SENSOR = macrocfg.upper_filament_sensor %}
    {% set LOWER_FILAMENT_SENSOR = macrocfg.lower_filament_sensor %}
    {% set FILAMENT_EXTRUSION_DELAY = macrocfg.filament_extrusion_delay %}
    {% set UPPER_DETECTED = printer["filament_switch_sensor " + UPPER_FILAMENT_SENSOR].filament_detected %}
    {% set LOWER_DETECTED = printer["filament_switch_sensor " + LOWER_FILAMENT_SENSOR].filament_detected %}

    # Check extrusion safety limit
    {% if printer["gcode_macro _EXTRUDE_TO_HOTEND"].extrusion_count >= MAX_EXTRUSIONS %}
        RESPOND MSG="❌ SAFETY STOP: Extruded {MAX_EXTRUSIONS}mm without dual sensor detection"
        RESPOND MSG="⚠️ Check sensor connections or run FILAMENT_LOAD again"
        SET_GCODE_VARIABLE MACRO=_EXTRUDE_TO_HOTEND VARIABLE=extrusion_count VALUE=0
        _FINALIZE_LOADING CONTEXT={CONTEXT} DID_LOADING=1
    {% else %}
        # Incremental extrusion toward lower sensor
        G91   
        G1 E{EXTRUSION_INCREMENT} F{EXTRUDE_SPEED}
        G90
        
        # Update safety counter
        SET_GCODE_VARIABLE MACRO=_EXTRUDE_TO_HOTEND VARIABLE=extrusion_count VALUE={printer["gcode_macro _EXTRUDE_TO_HOTEND"].extrusion_count + EXTRUSION_INCREMENT}
      
        {% if UPPER_DETECTED and LOWER_DETECTED %}
            RESPOND MSG="Both sensors detect - Filament properly positioned ({printer['gcode_macro _EXTRUDE_TO_HOTEND'].extrusion_count}mm)"
            SET_GCODE_VARIABLE MACRO=_EXTRUDE_TO_HOTEND VARIABLE=extrusion_count VALUE=0
            _FINALIZE_LOADING CONTEXT={CONTEXT} DID_LOADING=1
        {% else %}
            # Continue extruding with unified delayed gcode
            UPDATE_DELAYED_GCODE ID=CONTINUE_EXTRUSION DURATION={FILAMENT_EXTRUSION_DELAY}
        {% endif %}
    {% endif %}


[delayed_gcode CONTINUE_EXTRUSION]
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set STARTING_PRINT = macrocfg.starting_print %}
    
    # Determine context from current state
    {% if STARTING_PRINT == 1 %}
        _EXTRUDE_TO_HOTEND CONTEXT=PRINT_START
    {% else %}
        _EXTRUDE_TO_HOTEND CONTEXT=COLOR_CHANGE
    {% endif %}


# ======================================================================================================== #
# ====================================== FILAMENT LOAD FINALIZATION ====================================== #
# ======================================================================================================== #

[gcode_macro _FINALIZE_LOADING]
description: Route to context-specific finalization. Inputs: CONTEXT (PRINT_START or COLOR_CHANGE), DID_LOADING (0 or 1)
gcode:
    {% set CONTEXT = params.CONTEXT|default("unknown") %}
    {% set DID_LOADING = params.DID_LOADING|default(0)|int %}
    
    # Cancel any pending operations
    UPDATE_DELAYED_GCODE ID=CONTINUE_EXTRUSION DURATION=0
    UPDATE_DELAYED_GCODE ID=CONTINUE_WAITING DURATION=0
    
    # Context-specific finalization
    {% if CONTEXT == "PRINT_START" %}
        _FINALIZE_PRINT_START_LOAD DID_LOADING={DID_LOADING}
    {% elif CONTEXT == "COLOR_CHANGE" %}
        _FINALIZE_COLOR_CHANGE_LOAD DID_LOADING={DID_LOADING}
    {% else %}
        RESPOND MSG="Error: Unknown context '{CONTEXT}'"
    {% endif %}


[gcode_macro _FINALIZE_PRINT_START_LOAD]
description: Finalize print start loading and clear operation state. Inputs: DID_LOADING (0 or 1)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set DID_LOADING = params.DID_LOADING|default(0)|int %}
    {% set EXTRUDE_SPEED = macrocfg.filament_extrude_slow %}
    {% set POST_FILAMENT_LOAD = macrocfg.post_filament_load %}
    
    # Only do post-load extrusion if we actually loaded filament
    {% if DID_LOADING == 1 %}
        G91
        G1 E{POST_FILAMENT_LOAD} F{EXTRUDE_SPEED}
        G90
        RESPOND MSG="Filament loaded and positioned"
        
        # Clear operation state since we just loaded fresh filament
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE='"none"'
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE=0.0
        
        SAVE_VARIABLE VARIABLE=last_filament_operation VALUE='"none"'
        SAVE_VARIABLE VARIABLE=last_retract_amount VALUE=0.0
        SAVE_VARIABLE VARIABLE=last_push_amount VALUE=0.0
        
    {% else %}
        RESPOND MSG="Filament already positioned"
    {% endif %}
    
    RESPOND MSG="✅ Print start loading complete"
    _SET_LED_STATUS STATUS=STANDBY
    RESUME_BASE


[gcode_macro _FINALIZE_COLOR_CHANGE_LOAD]
description: Finalize color change loading with purge selection. Inputs: DID_LOADING (0 or 1)
gcode:
    {% set macrocfg = printer['gcode_macro _macroVariables'] %}
    {% set DID_LOADING = params.DID_LOADING|default(0)|int %}
    {% set AUTO_COLOR_CHANGE = macrocfg.auto_color_change %}
    {% set CURRENTLY_PRINTING = macrocfg.currently_printing %}
    {% set AUTO_FILAMENT_SENSOR = macrocfg.auto_filament_sensor %}
    {% set FILAMENT_M600_COLDSTART = macrocfg.filament_m600_coldstart %}
    {% set LED_STATUS = macrocfg.led_status %}
    
    # Clear operation state since we just loaded fresh filament
    {% if DID_LOADING == 1 %}
         SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_filament_operation VALUE='"none"'
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_retract_amount VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=last_push_amount VALUE=0.0
        
        SAVE_VARIABLE VARIABLE=last_filament_operation VALUE='"none"'
        SAVE_VARIABLE VARIABLE=last_retract_amount VALUE=0.0
        SAVE_VARIABLE VARIABLE=last_push_amount VALUE=0.0
    {% endif %}
    
    # Purge selection logic
    {% if AUTO_COLOR_CHANGE == 1 %}
        RESPOND MSG="Automated swap mode - Using standard purge"
        _PURGE TYPE=standard
        RESPOND MSG="Auto-resuming print after automated color change"
        RESUME
    {% else %}
        _GET_PRINT_STATE
        {% if CURRENTLY_PRINTING == 1 %}
            M400
            _PURGE TYPE=blobifier
        {% else %}
            _PURGE TYPE=standard
        {% endif %}
    {% endif %}

    {% if AUTO_FILAMENT_SENSOR == True %}
        _ENABLE_FILAMENT_SENSOR
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=_macroVariables VARIABLE=filament_m600_coldstart VALUE=0
    
    {% if LED_STATUS == True %}
        {% if AUTO_COLOR_CHANGE == 1 or CURRENTLY_PRINTING == 1 %}
            _SET_LED_STATUS STATUS=PRINTING
        {% else %}
            _SET_LED_STATUS STATUS=STANDBY
        {% endif %}
    {% endif %}
    
    RESPOND MSG="✅ Filament loading complete"
